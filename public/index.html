function useIsMobile() {
  const [mobile, setMobile] = useState(
    typeof window !== "undefined" ? window.innerWidth < 768 : false
  );
  useEffect(() => {
    const onResize = () => setMobile(window.innerWidth < 768);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return mobile;
}

/* ───────────────────── 온열질환(폭염) 단계 판정 ─────────────────────
   근거: 산업안전보건기준에 관한 규칙 제558~560조 (2025.6.1 시행)
   체감온도(기온+습도) 기준 단계 — 옥외작업 온열질환 예방 의무
──────────────────────────────────────────────────── */
function heatStage(feels) {
  if (feels >= 38) return {
    key: "위험", color: "#F2555A", label: "위험 (폭염중대경보)",
    action: "재난안전관리 긴급조치 외 옥외작업 중지. 무더위 시간대(14~17시) 작업 금지.",
  };
  if (feels >= 35) return {
    key: "경고", color: "#FF7A3C", label: "경고 (폭염경보)",
    action: "매 2시간마다 20분 이상 휴식 + 냉방·보냉장구(냉각조끼 등) 지급, 작업시간 단축.",
  };
  if (feels >= 33) return {
    key: "주의", color: "#FFB224", label: "주의 (폭염주의보)",
    action: "매 2시간 이내 20분 이상 휴식 제공(또는 1시간마다 10분). 물·그늘·휴식 준수.",
  };
  if (feels >= 31) return {
    key: "관심", color: "#E8C24A", label: "관심 (폭염작업)",
    action: "물·그늘·휴식 제공, 온·습도계 상시 비치, 작업 전 온열질환 예방교육(TBM).",
  };
  return {
    key: "정상", color: "#46C68F", label: "정상",
    action: "체감온도 31℃ 미만 — 통상 관리. 수분 섭취 권장.",
  };
}

/* 기상청 여름철 체감온도 (2022 개정식)
   Stull 습구온도(Tw)를 이용한 기상청 공식 산식.
   폭염영향예보·폭염 단계 판정에 쓰이는 값과 동일 기준. */
function feelsLike(temp, humidity) {
  const Ta = temp, RH = Math.min(100, Math.max(0, humidity));
  if (Ta < 25) return +Ta.toFixed(1); // 여름철 산식 적용 범위 밖은 기온 그대로
  // Stull 습구온도(℃)
  const Tw =
    Ta * Math.atan(0.151977 * Math.sqrt(RH + 8.313659)) +
    Math.atan(Ta + RH) -
    Math.atan(RH - 1.67633) +
    0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH) -
    4.686035;
  const at =
    -0.2442 + 0.55399 * Tw + 0.45535 * Ta -
    0.0022 * Tw * Tw + 0.00278 * Tw * Ta + 3.0;
  return +Math.max(Ta, at).toFixed(1);
}

/* ───────────────────── 기상청 초단기실황 연동 (영종도, 서버 프록시) ─────────────────────
   공공데이터포털 기상청_단기예보 조회서비스 > 초단기실황(getUltraSrtNcst)
   영종도(인천 중구) 격자 좌표: nx=55, ny=124
   T1H=기온(℃), REH=습도(%). 매시 정각 관측 → 약 40분 후 제공(10분 주기 갱신).

   실제 호출은 서버(server/routes/weather.js)에서 수행합니다. 서버 .env의
   KMA_SERVICE_KEY 가 설정되지 않았거나 기상청 API 호출이 실패하면
   /api/weather 가 { live: false } 를 반환하고, 이 경우 가상 데이터로 대체됩니다.
──────────────────────────────────────────────────── */
async function fetchYeongjongTemp() {
  try {
    const res = await fetch("/api/weather");
    const json = await res.json();
    if (!json.live) return null;
    return { temp: json.temp, humidity: json.humidity };
  } catch (e) {
    return null;
  }
}

/* ───────────────────── 온도 피드 훅 (외부=기상청 / 내부=가상) ───────────────────── */
function useTempFeed() {
  const outdoor = useRef({ temp: 33, humidity: 62, live: false });
  const [live, setLive] = useState(false);

  const mk = (now, i, ext, intr, hum) => ({
    t: new Date(now - i * 5000).toLocaleTimeString("ko-KR", { hour12: false, minute: "2-digit", second: "2-digit" }),
    외부: +ext.toFixed(1), 내부: +intr.toFixed(1),
    습도: Math.round(hum), 체감: feelsLike(ext, hum),
  });

  const [data, setData] = useState(() => {
    const now = Date.now();
    const arr = [];
    let ext = 33, intr = 24, hum = 62;
    for (let i = 29; i >= 0; i--) {
      ext += (Math.random() - 0.5) * 0.6;
      intr += (Math.random() - 0.5) * 0.4;
      hum = Math.min(85, Math.max(40, hum + (Math.random() - 0.5) * 2));
      arr.push(mk(now, i, ext, intr, hum));
    }
    return arr;
  });

  // 기상청 실황 폴링 (5분 주기)
  useEffect(() => {
    let alive = true;
    const pull = async () => {
      try {
        const r = await fetchYeongjongTemp();
        if (alive && r) {
          outdoor.current = { temp: r.temp, humidity: r.humidity, live: true };
          setLive(true);
        }
      } catch (e) { /* CORS·키 오류 시 가상 유지 */ }
    };
    pull();
    const iv = setInterval(pull, 5 * 60 * 1000);
    return () => { alive = false; clearInterval(iv); };
  }, []);

  // 차트 갱신 (3초): 외부=실황값 유지(가상일 땐 완만한 변동), 내부=가상
  useEffect(() => {
    const iv = setInterval(() => {
      setData((prev) => {
        const last = prev[prev.length - 1];
        const o = outdoor.current;
        const ext = o.live
          ? o.temp + (Math.random() - 0.5) * 0.15
          : last.외부 + (Math.random() - 0.48) * 0.6;
        const hum = o.live ? o.humidity : Math.min(85, Math.max(40, last.습도 + (Math.random() - 0.5) * 2));
        const intr = last.내부 + (Math.random() - 0.5) * 0.4;
        return [...prev.slice(1), mk(Date.now(), 0, ext, intr, hum)];
      });
    }, 3000);
    return () => clearInterval(iv);
  }, []);

  return { data, live };
}

/* ───────────────────── AI 에이전트 ───────────────────── */
function AgentPanel({ open, onClose, permits, alarms, sentLinks }) {
  const isMobile = useIsMobile();
  const [msgs, setMsgs] = useState([
    { role: "assistant", content: "안전관제 에이전트입니다. 작업허가서 현황, 알람 분석, 위험구역 판단, 서명 미완료 건 확인 등 무엇이든 물어보세요." },
  ]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, busy]);

  const context = useMemo(() => ({
    현재시각: new Date().toLocaleString("ko-KR"),
    현장목록: SITES,
    작업허가서: permits,
    최근알람: (alarms || []).slice(0, 6),
    위험히트맵: { 구역: HEAT_ROWS, 항목: HEAT_COLS, 점수: HEAT },
    서명링크발송이력: sentLinks,
  }), [permits, alarms, sentLinks]);

  // 서버(/api/agent)가 Anthropic API를 대신 호출하고 SSE로 응답을 스트리밍합니다.
  // 브라우저는 API 키를 알지 못하며, 컨텍스트 주입 프롬프트도 서버에서 구성됩니다.
  const ask = async () => {
    const q = input.trim();
    if (!q || busy) return;
    const history = [...msgs, { role: "user", content: q }];
    setMsgs([...history, { role: "assistant", content: "" }]);
    setInput("");
    setBusy(true);

    const setLastAssistant = (content) => {
      setMsgs((m) => {
        const next = [...m];
        next[next.length - 1] = { role: "assistant", content };
        return next;
      });
    };

    try {
      const apiMessages = history.slice(1); // 첫 안내 메시지(assistant) 제외 — user로 시작
      const res = await fetch("/api/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages, context }),
      });
      if (!res.ok || !res.body) {
        const errJson = await res.json().catch(() => null);
        throw new Error(errJson?.error || "요청에 실패했습니다.");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          const payload = part.slice(6);
          if (payload === "[DONE]") continue;
          const evt = JSON.parse(payload);
          if (evt.error) throw new Error(evt.error);
          if (evt.delta) {
            text += evt.delta;
            setLastAssistant(text);
          }
        }
      }
      if (!text) setLastAssistant("응답을 받지 못했습니다. 다시 시도해 주세요.");
    } catch (e) {
      setLastAssistant(e.message || "네트워크 오류로 답변에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;

  const wrapStyle = isMobile
    ? {
        position: "fixed", inset: 0, zIndex: 100, background: T.panel2,
        display: "flex", flexDirection: "column",
      }
    : {
        width: 360, flexShrink: 0, borderLeft: `1px solid ${T.line}`, background: T.panel2,
        display: "flex", flexDirection: "column", height: "100%",
      };

  return (
    <div style={wrapStyle}>
      <div style={{ padding: "14px 16px", borderBottom: `1px solid ${T.line}`, display: "flex", alignItems: "center", gap: 10 }}>
        <Bot size={18} color={T.amber} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>안전관제 에이전트</div>
          <div style={{ fontSize: 11, color: T.muted, fontFamily: T.mono }}>대시보드 데이터 연동됨</div>
        </div>
        <button onClick={onClose} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 8 }}><X size={18} /></button>
      </div>
      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{
            alignSelf: m.role === "user" ? "flex-end" : "flex-start",
            maxWidth: "88%", padding: "10px 12px", borderRadius: 8, fontSize: 13, lineHeight: 1.55, whiteSpace: "pre-wrap",
            background: m.role === "user" ? `${T.amber}22` : T.panel,
            border: `1px solid ${m.role === "user" ? `${T.amber}44` : T.line}`,
          }}>{m.content}</div>
        ))}
        {busy && <div style={{ fontSize: 12, color: T.muted, fontFamily: T.mono }}>분석 중…</div>}
      </div>
      <div style={{
        padding: 12, borderTop: `1px solid ${T.line}`, display: "flex", gap: 8,
        paddingBottom: isMobile ? "calc(12px + env(safe-area-inset-bottom))" : 12,
      }}>
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && ask()}
          placeholder="예: 서명 안 된 허가서 알려줘"
          style={{
            flex: 1, background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6,
            color: T.text, padding: "12px", fontSize: 14, outline: "none", minWidth: 0,
          }}
        />
        <button onClick={ask} disabled={busy} style={{
          background: T.amber, border: "none", borderRadius: 6, width: 46, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", opacity: busy ? 0.5 : 1, flexShrink: 0,
        }}><Send size={16} color="#111" /></button>
      </div>
    </div>
  );
}

/* ───────────────────── 각 화면 ───────────────────── */
function Overview({ permits, alarms, temp }) {
  const isMobile = useIsMobile();
  const pending = permits.filter((p) => p.status === "승인대기").length;
  const active = permits.filter((p) => p.status === "진행중").length;
  const unack = alarms.filter((a) => !a.ack).length;
  const lastTemp = temp[temp.length - 1];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(auto-fit, minmax(170px, 1fr))", gap: 10 }}>
        <Kpi label="진행중 허가" value={active} sub={`승인대기 ${pending}건`} color={T.cyan} />
        <Kpi label="미확인 알람" value={unack} sub="즉시 확인 필요" color={unack > 0 ? T.red : T.green} />

function Heatmap() {
  const cellColor = (v) => {
    if (v >= 75) return T.red;
    if (v >= 50) return T.amber;
    if (v >= 25) return "#C9A64A";
    return T.green;
  };
  return (
    <Panel title="구역별 위험 히트맵 (0–100)" right={<Badge color={T.red}>최고 88 · BOH 질식(주방덕트)</Badge>}>
      <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
        <div style={{
          display: "grid",
          gridTemplateColumns: `72px repeat(${HEAT_COLS.length}, minmax(76px, 1fr))`,
          gap: 5, minWidth: 480,
        }}>
          <div />
          {HEAT_COLS.map((c) => (
            <div key={c} style={{ textAlign: "center", fontSize: 11, color: T.muted, fontFamily: T.mono, paddingBottom: 4 }}>{c}</div>
          ))}
          {HEAT_ROWS.map((r, ri) => (
            <React.Fragment key={r}>
              <div style={{ fontSize: 11, color: T.muted, fontFamily: T.mono, display: "flex", alignItems: "center" }}>{r}</div>
              {HEAT[ri].map((v, ci) => {
                const c = cellColor(v);
                return (
                  <div key={ci} title={`${r} · ${HEAT_COLS[ci]}: ${v}`} style={{
                    background: `${c}${Math.round(30 + (v / 100) * 60).toString(16).padStart(2, "0")}`,
                    border: `1px solid ${c}66`, borderRadius: 5, height: 48,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontFamily: T.mono, fontSize: 14, fontWeight: 700,
                    color: v >= 50 ? "#0B0F14" : T.text,
                  }}>{v}</div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
      <div style={{ display: "flex", gap: 14, marginTop: 14, fontSize: 11, color: T.muted, fontFamily: T.mono, flexWrap: "wrap" }}>
        <span><span style={{ color: T.green }}>■</span> 0–24 낮음</span>
        <span><span style={{ color: "#C9A64A" }}>■</span> 25–49 보통</span>
        <span><span style={{ color: T.amber }}>■</span> 50–74 주의</span>
        <span><span style={{ color: T.red }}>■</span> 75+ 위험</span>
      </div>
    </Panel>
  );
}

  const isMobile = useIsMobile();
  const unsignedPermits = permits.filter((p) => !p.signed);
  const [sel, setSel] = useState(preselect || (unsignedPermits[0] ? unsignedPermits[0].id : ""));

  const permit = permits.find((p) => p.id === sel);

  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: isMobile ? "1fr" : "minmax(300px, 400px) 1fr",
      gap: 14, alignItems: "start",

function SignaturePad({ title, onSave, onClose }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    const c = canvasRef.current;
    const dpr = window.devicePixelRatio || 1;
    const rect = c.getBoundingClientRect();
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = "#E6EDF5";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = (e) => {
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.beginPath(); ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.lineTo(x, y); ctx.stroke();
    setDirty(true);
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.restore();
    setDirty(false);
  };

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.7)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div style={{
        width: "100%", maxWidth: 440, background: T.panel, border: `1px solid ${T.line}`,
        borderRadius: 10, overflow: "hidden",
      }}>
        <div style={{ padding: "14px 16px", borderBottom: `1px solid ${T.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{title} 서명</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>아래 영역에 손가락 또는 마우스로 서명하세요</div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 6 }}><X size={18} /></button>
        </div>
        <div style={{ padding: 16 }}>
          <canvas
            ref={canvasRef}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
            style={{
              width: "100%", height: 180, background: T.bg,
              border: `1px dashed ${T.line}`, borderRadius: 8,
              touchAction: "none", display: "block", cursor: "crosshair",
            }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button onClick={clear} style={{
              flex: 1, background: "none", border: `1px solid ${T.line}`, borderRadius: 6,
              color: T.muted, padding: "12px 0", fontSize: 13, cursor: "pointer",
            }}>지우기</button>
            <button
              disabled={!dirty}
              onClick={() => onSave(canvasRef.current.toDataURL("image/png"))}
              style={{
                flex: 2, background: dirty ? T.green : T.line, border: "none", borderRadius: 6,
                color: "#0B0F14", padding: "12px 0", fontSize: 14, fontWeight: 700,
                cursor: dirty ? "pointer" : "default",
              }}
            >서명 저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PermitForm({ onSubmit }) {
  const isMobile = useIsMobile();
  const inp = {

    color: T.text, padding: "11px 12px", fontSize: 13, outline: "none", boxSizing: "border-box",

  };
  const [formType, setFormType] = useState("general");
  const [f, setF] = useState(empty);
  const [kinds, setKinds] = useState([]);
  const [checks, setChecks] = useState([]);
  const [err, setErr] = useState(null);
  const [workers, setWorkers] = useState([{ name: "", contact: "", sig: null }]);
  const [sigTarget, setSigTarget] = useState(null); // 작업자 서명패드 대상 index
  // 승인 서명: 인스파이어 책임자 / 인스파이어 담당자 / 공사업체 책임자
  const [approvals, setApprovals] = useState({
    inspireManager: { name: "", sig: null },
    inspireStaff: { name: "", sig: null },
    contractor: { name: "", sig: null },
  });
  const [apprSigTarget, setApprSigTarget] = useState(null); // 승인 서명패드 대상 key

  const APPROVAL_ROLES = [
    { key: "inspireManager", label: "인스파이어 책임자", hint: "구역 안전책임자 (발급 승인)" },
    { key: "inspireStaff", label: "인스파이어 담당자", hint: "현장 확인·입회 담당" },
    { key: "contractor", label: "공사업체 책임자", hint: "시공/작업 수행 업체" },
  ];
  const setApproval = (key, patch) => setApprovals((prev) => ({ ...prev, [key]: { ...prev[key], ...patch } }));

  const setWorker = (i, k, v) => setWorkers((prev) => prev.map((w, idx) => (idx === i ? { ...w, [k]: v } : w)));
  const addWorker = () => setWorkers((prev) => [...prev, { name: "", contact: "", sig: null }]);
  const removeWorker = (i) => setWorkers((prev) => (prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev));

  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const toggle = (arr, setArr, v) => setArr(arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  const switchType = (t) => {
    setFormType(t); setKinds([]); setChecks([]); setErr(null);
    setApprovals({ inspireManager: { name: "", sig: null }, inspireStaff: { name: "", sig: null }, contractor: { name: "", sig: null } });
  };

  const submit = () => {
    if (!f.desc.trim()) return setErr("작업 내용을 입력하세요.");
    if (!f.start || !f.end) return setErr("작업 시작/종료 일시를 입력하세요.");
    if (!f.worker.trim() || !f.contact.trim()) return setErr("작업(행사) 책임자 성명과 연락처를 입력하세요.");
    if (workers.some((w) => !w.name.trim() || !w.contact.trim()))
      return setErr("모든 작업자의 성명과 연락처를 빠짐없이 기입하세요. 미기입 작업자는 허가서에 등재할 수 없습니다.");
    if (formType === "hazard" && kinds.length === 0) return setErr("위험작업 종류를 1개 이상 선택하세요.");
    if (formType === "rental" && !f.company.trim()) return setErr("임대(대관) 업체명을 입력하세요.");
    const required = FORM_CHECKS[formType];
    if (checks.length < required.length) return setErr("모든 안전조치 확인 항목에 체크해야 발급 신청이 가능합니다.");
    for (const r of APPROVAL_ROLES) {
      if (!approvals[r.key].name.trim()) return setErr(`${r.label} 성명을 입력하세요.`);
      if (!approvals[r.key].sig) return setErr(`${r.label} 서명이 필요합니다.`);
    }

    const typeLabel =
      formType === "general" ? "일반작업" :
      formType === "rental" ? "임대·대관" :
      kinds[0] + (kinds.length > 1 ? ` 외 ${kinds.length - 1}` : "");
    onSubmit({
      type: typeLabel,
      site: formType === "rental" ? `${f.site} / ${f.company}` : f.site,
      worker: f.worker, contact: f.contact,
      workers: workers.map((w) => ({ name: w.name.trim(), contact: w.contact.trim(), signed: !!w.sig, sig: w.sig })),
      approvals: {
        inspireManager: { ...approvals.inspireManager },
        inspireStaff: { ...approvals.inspireStaff },
        contractor: { ...approvals.contractor },
      },
      start: f.start.slice(5).replace("T", " "), end: f.end.slice(5).replace("T", " "),
      detail: { formType, ...f, kinds, checks },
    });
    setF(empty); setKinds([]); setChecks([]); setWorkers([{ name: "", contact: "", sig: null }]);
    setApprovals({ inspireManager: { name: "", sig: null }, inspireStaff: { name: "", sig: null }, contractor: { name: "", sig: null } });

          </button>

      </div>

      <Panel title={`${cur.label} 작성`} right={<Badge color={T.cyan}>KOSHA GUIDE P-94 기반</Badge>}>

          {/* 기본 정보 */}

            <Field label="대상 현장" required>
              <select value={f.site} onChange={set("site")} style={inp}>
                {SITES.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
              </select>
            </Field>
            <Field label={formType === "rental" ? "대관 시설/구역" : "작업 장소 (상세)"} required>
              <input value={f.location} onChange={set("location")} placeholder={formType === "rental" ? "예: Rotunda 대관 행사장" : "예: BOH 주방덕트 / Rotunda 천장부"} style={inp} />
            </Field>
            <Field label={formType === "rental" ? "사용 목적 및 작업(행사) 내용" : "작업 내용"} required span>
              <textarea value={f.desc} onChange={set("desc")} rows={3} placeholder="작업 범위, 방법, 사용 장비 등을 구체적으로 기재" style={{ ...inp, resize: "vertical", fontFamily: "inherit" }} />

              </Field>
              <Field label="반입 장비/물품" span>
                <input value={f.equipment} onChange={set("equipment")} placeholder="예: 음향장비 1식, 이동식 리프트 1대" style={inp} />
              </Field>
            </div>
          )}

          {/* 위험작업 전용 */}
          {formType === "hazard" && (
            <>
              <div>
                <div style={{ fontSize: 12, color: T.muted, marginBottom: 8 }}>위험작업 종류 <span style={{ color: T.red }}>*</span> (복수 선택 가능 — 보충작업허가 병행)</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {HAZARD_KINDS.map((k) => (
                    <button key={k} onClick={() => toggle(kinds, setKinds, k)} style={{
                      padding: "8px 14px", borderRadius: 20, fontSize: 13, cursor: "pointer",
                      background: kinds.includes(k) ? `${T.red}22` : T.bg,
                      border: `1px solid ${kinds.includes(k) ? T.red : T.line}`,
                      color: kinds.includes(k) ? T.red : T.muted,
                    }}>{k}</button>
                  ))}
                </div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 12 }}>
                <Field label="산소농도 (%)"><input value={f.o2} onChange={set("o2")} placeholder="18.0~23.5" style={inp} /></Field>
                <Field label="가연성가스 (%LEL)"><input value={f.lel} onChange={set("lel")} placeholder="< 10" style={inp} /></Field>
                <Field label="CO (ppm)"><input value={f.co} onChange={set("co")} placeholder="< 30" style={inp} /></Field>
                <Field label="감시인 성명"><input value={f.watcher} onChange={set("watcher")} placeholder="감시인/화기감시자" style={inp} /></Field>
              </div>
            </>
          )}

          {/* 작업 책임자 */}
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 12 }}>
            <Field label={formType === "rental" ? "행사(작업) 책임자" : "작업 책임자"} required>
              <input value={f.worker} onChange={set("worker")} placeholder="성명" style={inp} />
            </Field>
            <Field label="책임자 연락처" required>
              <input value={f.contact} onChange={set("contact")} placeholder="010-0000-0000" style={inp} />
            </Field>
          </div>

          {/* 작업자 명단 (성명·연락처·서명 필수) */}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600 }}>작업자 명단 <span style={{ color: T.red }}>*</span></span>
              <span style={{ fontSize: 11, color: T.muted }}>전원 성명·연락처 필수 기입 · 서명은 현장 서명 또는 서명링크 발송으로 완료</span>
              <span style={{ marginLeft: "auto", fontSize: 11, fontFamily: T.mono, color: T.muted }}>
                총 {workers.length}명 · 서명 {workers.filter((w) => w.sig).length}명
              </span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {workers.map((w, i) => (
                <div key={i} style={{
                  display: "grid",
                  gridTemplateColumns: isMobile ? "1fr" : "32px 1fr 1fr 130px 36px",
                  gap: 8, alignItems: "center",
                  background: T.bg, border: `1px solid ${w.sig ? `${T.green}55` : T.line}`,
                  borderRadius: 8, padding: 10,
                }}>
                  <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, textAlign: isMobile ? "left" : "center" }}>{i + 1}</span>
                  <input
                    value={w.name}
                    onChange={(e) => setWorker(i, "name", e.target.value)}
                    placeholder="작업자 성명"
                    style={{ ...inp, background: T.panel2 }}
                  />
                  <input
                    value={w.contact}
                    onChange={(e) => setWorker(i, "contact", e.target.value)}
                    placeholder="연락처 010-0000-0000"
                    style={{ ...inp, background: T.panel2 }}
                  />
                  {w.sig ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <img src={w.sig} alt={`${w.name} 서명`} style={{
                        height: 34, maxWidth: 90, background: "#FFFFFF10",
                        border: `1px solid ${T.green}44`, borderRadius: 4, objectFit: "contain",
                      }} />
                      <button onClick={() => setWorker(i, "sig", null)} title="서명 다시하기" style={{
                        background: "none", border: "none", color: T.muted, cursor: "pointer", fontSize: 11,
                      }}>재서명</button>
                    </div>
                  ) : (
                    <button onClick={() => setSigTarget(i)} style={{
                      background: `${T.cyan}14`, border: `1px solid ${T.cyan}55`, color: T.cyan,
                      borderRadius: 6, padding: "9px 0", fontSize: 12, cursor: "pointer",
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
                    }}><PenLine size={13} /> 현장 서명</button>
                  )}
                  <button onClick={() => removeWorker(i)} disabled={workers.length === 1} title="행 삭제" style={{
                    background: "none", border: `1px solid ${T.line}`, borderRadius: 6,
                    color: workers.length === 1 ? T.line : T.muted, cursor: workers.length === 1 ? "default" : "pointer",
                    height: 34, display: "flex", alignItems: "center", justifyContent: "center",
                  }}><X size={14} /></button>
                </div>
              ))}
            </div>
            <button onClick={addWorker} style={{
              marginTop: 8, width: "100%", background: "none", border: `1px dashed ${T.line}`,
              borderRadius: 8, color: T.muted, padding: "11px 0", fontSize: 13, cursor: "pointer",
            }}>+ 작업자 추가</button>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 8, lineHeight: 1.5 }}>
              현장에서 서명하지 못한 작업자는 허가서 등록 후 <b style={{ color: T.amber }}>서명링크</b> 탭에서 각 작업자의 연락처로 전자서명 링크를 발송할 수 있습니다.
            </div>
          </div>

          {sigTarget !== null && (
            <SignaturePad
              title={workers[sigTarget]?.name || `작업자 ${sigTarget + 1}`}
              onClose={() => setSigTarget(null)}
              onSave={(dataUrl) => { setWorker(sigTarget, "sig", dataUrl); setSigTarget(null); }}
            />
          )}

          {/* 승인 서명: 인스파이어 책임자 / 담당자 / 공사업체 책임자 */}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <PenLine size={15} color={T.amber} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>승인 서명 <span style={{ color: T.red }}>*</span></span>
              <span style={{ fontSize: 11, color: T.muted }}>인스파이어 2인 + 공사업체 책임자 서명 필수</span>
              <span style={{ marginLeft: "auto", fontSize: 11, fontFamily: T.mono, color: T.muted }}>
                {APPROVAL_ROLES.filter((r) => approvals[r.key].sig).length}/3 서명
              </span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr", gap: 10 }}>
              {APPROVAL_ROLES.map((r) => {
                const a = approvals[r.key];
                const inspire = r.key !== "contractor";
                const accent = inspire ? T.amber : T.cyan;
                return (
                  <div key={r.key} style={{
                    background: T.bg, border: `1px solid ${a.sig ? `${T.green}55` : T.line}`,
                    borderRadius: 8, padding: 12, display: "flex", flexDirection: "column", gap: 10,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 6, height: 6, borderRadius: "50%", background: accent }} />
                      <span style={{ fontSize: 13, fontWeight: 700 }}>{r.label}</span>
                    </div>
                    <div style={{ fontSize: 11, color: T.muted, marginTop: -4 }}>{r.hint}</div>
                    <input
                      value={a.name}
                      onChange={(e) => setApproval(r.key, { name: e.target.value })}
                      placeholder="성명"
                      style={{ ...inp, background: T.panel2 }}
                    />
                    {a.sig ? (
                      <div style={{
                        display: "flex", alignItems: "center", justifyContent: "space-between",
                        background: "#FFFFFF08", border: `1px solid ${T.green}44`, borderRadius: 6, padding: "6px 8px",
                      }}>
                        <img src={a.sig} alt={`${r.label} 서명`} style={{ height: 40, maxWidth: "70%", objectFit: "contain" }} />
                        <button onClick={() => setApproval(r.key, { sig: null })} style={{
                          background: "none", border: "none", color: T.muted, cursor: "pointer", fontSize: 11,
                        }}>재서명</button>
                      </div>
                    ) : (
                      <button onClick={() => setApprSigTarget(r.key)} style={{
                        background: `${accent}14`, border: `1px solid ${accent}55`, color: accent,
                        borderRadius: 6, padding: "11px 0", fontSize: 13, cursor: "pointer",
                        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                      }}><PenLine size={14} /> 서명하기</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {apprSigTarget !== null && (
            <SignaturePad
              title={APPROVAL_ROLES.find((r) => r.key === apprSigTarget)?.label || "승인자"}
              onClose={() => setApprSigTarget(null)}
              onSave={(dataUrl) => { setApproval(apprSigTarget, { sig: dataUrl }); setApprSigTarget(null); }}
            />
          )}

          {/* 안전조치 확인 */}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <ClipboardCheck size={15} color={T.amber} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>안전조치 확인사항</span>
              <span style={{ fontSize: 11, color: T.muted, fontFamily: T.mono }}>{checks.length}/{FORM_CHECKS[formType].length}</span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 8 }}>
              {FORM_CHECKS[formType].map((c) => (
                <label key={c} style={{
                  display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 12px",
                  background: checks.includes(c) ? `${T.green}10` : T.bg,
                  border: `1px solid ${checks.includes(c) ? `${T.green}55` : T.line}`,
                  borderRadius: 6, fontSize: 13, cursor: "pointer", lineHeight: 1.4,
                }}>
                  <input type="checkbox" checked={checks.includes(c)} onChange={() => toggle(checks, setChecks, c)}
                    style={{ accentColor: T.green, marginTop: 2, flexShrink: 0 }} />
                  {c}
                </label>
              ))}
            </div>
          </div>

          {err && (
            <div style={{
              display: "flex", alignItems: "center", gap: 8, padding: "10px 14px",
              background: `${T.red}14`, border: `1px solid ${T.red}55`, borderRadius: 6,
              fontSize: 13, color: T.red,
            }}>
              <CircleAlert size={15} /> {err}
            </div>
          )}

          <button onClick={submit} style={{
            background: T.amber, border: "none", borderRadius: 6, padding: "14px 0",
            fontSize: 15, fontWeight: 700, color: "#111", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          }}>
            <FilePlus2 size={16} /> 허가서 발급 신청 (승인대기 등록)
          </button>
          <div style={{ fontSize: 11, color: T.muted, lineHeight: 1.6 }}>
            신청 즉시 「작업허가서」 목록에 승인대기 상태로 등록되며, 서명링크 탭에서 책임자 연락처로 전자서명 링크를 발송할 수 있습니다.
            법적 근거: 산업안전보건법 제38·39조(안전·보건조치), 제63·64조(도급 시 안전보건 확보), 산업안전보건기준에 관한 규칙 제241조의2(화재위험작업)·제619조(밀폐공간 작업 프로그램), KOSHA GUIDE P-94(안전작업허가 지침). 실제 운영 시 사업장 내부 규정에 맞게 항목을 조정하세요.
          </div>
        </div>
      </Panel>
    </div>
  );
}

/* ───────────────────── 메인 앱 ───────────────────── */
const NAV = [
  { key: "overview", label: "종합현황", icon: LayoutDashboard },
  { key: "permits", label: "허가서", icon: FileCheck2 },
  { key: "form", label: "작성", icon: FilePlus2 },
  { key: "alarms", label: "알람", icon: BellRing },
  { key: "heatmap", label: "히트맵", icon: Grid3X3 },
  { key: "temp", label: "온도", icon: Thermometer },
  { key: "sites", label: "현장", icon: MapPin },
  { key: "sign", label: "서명링크", icon: PenLine },
];
const NAV_FULL_LABEL = {
  overview: "종합현황", permits: "작업허가서", form: "허가서 작성", alarms: "알람이력",
  heatmap: "위험 히트맵", temp: "온도 실시간", sites: "현장 목록", sign: "서명링크",
};

function SafetyDashboard() {
  const isMobile = useIsMobile();
  const [tab, setTab] = useState("overview");
  const [agentOpen, setAgentOpen] = useState(false);
  const [permits, setPermits] = useState([]);
  const [alarms, setAlarms] = useState([]);
  const [sentLinks, setSentLinks] = useState([]);
  const [preselect, setPreselect] = useState(null);
  const [toast, setToast] = useState(null);
  const { data: temp, live: tempLive } = useTempFeed();

  // 데스크톱에서는 에이전트 기본 열림
  useEffect(() => { if (!isMobile) setAgentOpen(true); }, [isMobile]);

  // 초기 로드: 허가서·알람·서명링크 이력을 서버(SQLite)에서 조회
  useEffect(() => {
    fetch("/api/permits").then((r) => r.json()).then(setPermits).catch(() => {});
    fetch("/api/alarms").then((r) => r.json()).then(setAlarms).catch(() => {});
    fetch("/api/sign-links").then((r) => r.json()).then(setSentLinks).catch(() => {});
  }, []);

  // 알람 확인(ack) 실시간 반영 — 다른 클라이언트의 확인 처리도 즉시 동기화
  useEffect(() => {
    const es = new EventSource("/api/alarms/stream");
    es.onmessage = (e) => {
      const updated = JSON.parse(e.data);
      setAlarms((prev) => prev.map((a) => (a.id === updated.id ? updated : a)));
    };
    return () => es.close();
  }, []);

  const ackAlarm = (id) => {
    fetch(`/api/alarms/${id}/ack`, { method: "POST" })
      .then((r) => r.json())
      .then((updated) => setAlarms((prev) => prev.map((a) => (a.id === updated.id ? updated : a))))
      .catch(() => {});
  };

  const sendLink = (permit, targets) => {
    const list = targets && targets.length
      ? targets
      : permitWorkers(permit).filter((w) => !w.signed);
    if (list.length === 0) return;
    Promise.all(
      list.map((w) =>
        fetch("/api/sign-links", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ permitId: permit.id, worker: w.name, contact: w.contact }),
        }).then((r) => r.json())
      )
    ).then((sent) => {
      setSentLinks((prev) => [...sent.reverse(), ...prev]);
      setToast(
        list.length === 1
          ? `${list[0].name} (${list[0].contact})에게 서명링크를 전송했습니다.`
          : `미서명 작업자 ${list.length}명에게 서명링크를 전송했습니다.`
      );
      setTimeout(() => setToast(null), 3000);
    });
  };

  const goSign = (permit) => { setPreselect(permit.id); setTab("sign"); };

  const addPermit = (p) => {
    fetch("/api/permits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(p),
    })
      .then((r) => r.json())
      .then((created) => {
        setPermits((prev) => [created, ...prev]);
        setToast(`${created.id} 허가서가 승인대기로 등록되었습니다. (작업자 ${p.workers.length}명, 서명 ${p.workers.filter((w) => w.signed).length}명)`);
        setTimeout(() => setToast(null), 3500);
        setTab("permits");
      });
  };

  const content = (
    <>
      {tab === "overview" && <Overview permits={permits} alarms={alarms} temp={temp} />}
      {tab === "permits" && <Permits permits={permits} onSign={goSign} />}
      {tab === "form" && <PermitForm onSubmit={addPermit} />}
      {tab === "alarms" && <AlarmHistory alarms={alarms} onAck={ackAlarm} />}
      {tab === "heatmap" && <Heatmap />}
      {tab === "temp" && <TempFeed temp={temp} live={tempLive} />}
      {tab === "sites" && <SiteList />}
      {tab === "sign" && <SignLink permits={permits} sentLinks={sentLinks} onSend={sendLink} preselect={preselect} />}
    </>
  );

  const fontFamily = "'Pretendard', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif";

  /* ── 모바일 레이아웃 ── */
  if (isMobile) {
    return (
      <div style={{
        display: "flex", flexDirection: "column", height: "100vh",
        background: T.bg, color: T.text, fontFamily, overflow: "hidden",
      }}>
        {/* 상단 헤더 */}
        <div style={{ background: T.panel2, borderBottom: `1px solid ${T.line}` }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px" }}>
            <div>
              <span style={{ fontFamily: T.mono, fontSize: 15, fontWeight: 700 }}>
                SAFE<span style={{ color: T.amber }}>OPS</span>
              </span>
              <span style={{ fontSize: 12, color: T.muted, marginLeft: 10 }}>{NAV_FULL_LABEL[tab]}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: T.green, boxShadow: `0 0 6px ${T.green}` }} />
              <button onClick={() => setAgentOpen(true)} style={{
                background: `${T.amber}18`, border: `1px solid ${T.amber}55`, color: T.amber,
                borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer",
                display: "flex", alignItems: "center", gap: 6,
              }}>
                <Bot size={14} /> 에이전트
              </button>
            </div>
          </div>
          <div style={{ height: 4, background: `repeating-linear-gradient(-45deg, ${T.amber} 0 8px, #14181F 8px 16px)` }} />
        </div>

        {/* 콘텐츠 */}
        <div style={{ flex: 1, overflowY: "auto", padding: 14, WebkitOverflowScrolling: "touch" }}>
          {content}
        </div>

        {/* 하단 탭바 */}
        <div style={{
          display: "flex", overflowX: "auto", background: T.panel2,
          borderTop: `1px solid ${T.line}`, WebkitOverflowScrolling: "touch",
          paddingBottom: "env(safe-area-inset-bottom)",
        }}>
          {NAV.map(({ key, label, icon: Icon }) => (
            <button key={key} onClick={() => setTab(key)} style={{
              flex: "1 0 auto", minWidth: 66, padding: "10px 6px 8px",
              background: "none", border: "none",
              borderTop: `2px solid ${tab === key ? T.amber : "transparent"}`,
              color: tab === key ? T.amber : T.muted, cursor: "pointer",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
            }}>
              <Icon size={19} />
              <span style={{ fontSize: 10 }}>{label}</span>
            </button>
          ))}
        </div>

        <AgentPanel open={agentOpen} onClose={() => setAgentOpen(false)} permits={permits} alarms={alarms} sentLinks={sentLinks} />

        {toast && (
          <div style={{
            position: "fixed", bottom: 88, left: 16, right: 16,
            background: T.panel, border: `1px solid ${T.green}66`, color: T.text,
            padding: "12px 16px", borderRadius: 8, fontSize: 13, zIndex: 120,
            display: "flex", alignItems: "center", gap: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
          }}>
            <CircleCheck size={16} color={T.green} style={{ flexShrink: 0 }} /> {toast}
          </div>
        )}
      </div>
    );
  }

  /* ── 데스크톱 레이아웃 ── */
  return (
    <div style={{
      display: "flex", height: "100vh", background: T.bg, color: T.text,
      fontFamily, overflow: "hidden",
    }}>
      {/* 사이드바 */}
      <div style={{
        width: 200, flexShrink: 0, borderRight: `1px solid ${T.line}`, background: T.panel2,
        display: "flex", flexDirection: "column",
      }}>
        <div style={{ padding: "18px 16px 14px" }}>
          <div style={{ fontFamily: T.mono, fontSize: 15, fontWeight: 700, letterSpacing: "0.04em" }}>
            SAFE<span style={{ color: T.amber }}>OPS</span>
          </div>
          <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>현장 안전관제 시스템</div>
        </div>
        <div style={{ height: 5, background: `repeating-linear-gradient(-45deg, ${T.amber} 0 8px, #14181F 8px 16px)` }} />
        <nav style={{ padding: 10, display: "flex", flexDirection: "column", gap: 2, flex: 1 }}>
          {NAV.map(({ key, icon: Icon }) => (
            <button key={key} onClick={() => setTab(key)} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "10px 12px",
              background: tab === key ? `${T.amber}18` : "none",
              border: "none", borderLeft: `2px solid ${tab === key ? T.amber : "transparent"}`,
              borderRadius: 4, color: tab === key ? T.text : T.muted,
              fontSize: 13, cursor: "pointer", textAlign: "left",
            }}>
              <Icon size={16} color={tab === key ? T.amber : T.muted} />
              {NAV_FULL_LABEL[key]}
            </button>
          ))}
        </nav>
        <button onClick={() => setAgentOpen((v) => !v)} style={{
          margin: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          padding: "10px 0", background: agentOpen ? `${T.amber}18` : "none",
          border: `1px solid ${T.amber}55`, borderRadius: 6, color: T.amber, fontSize: 13, cursor: "pointer",
        }}>
          <Bot size={15} /> {agentOpen ? "에이전트 닫기" : "에이전트 열기"}
        </button>
      </div>

      {/* 메인 */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <div style={{
          padding: "14px 22px", borderBottom: `1px solid ${T.line}`,
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{NAV_FULL_LABEL[tab]}</div>
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.mono, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: T.green, boxShadow: `0 0 6px ${T.green}` }} />
            시스템 정상 · 2026-07-07
          </div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 20 }}>
          {content}
        </div>
      </div>

      <AgentPanel open={agentOpen} onClose={() => setAgentOpen(false)} permits={permits} alarms={alarms} sentLinks={sentLinks} />

      {toast && (
        <div style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          background: T.panel, border: `1px solid ${T.green}66`, color: T.text,
          padding: "12px 20px", borderRadius: 8, fontSize: 13, zIndex: 50,
          display: "flex", alignItems: "center", gap: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
        }}>
          <CircleCheck size={16} color={T.green} /> {toast}
        </div>
      )}
    </div>
  );
}

const _root = createRoot(document.getElementById("root"));
_root.render(<SafetyDashboard />);
const _l = document.getElementById("loading");
if (_l) _l.remove();
</script>
</body>
</html>
