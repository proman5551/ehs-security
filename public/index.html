  const publicUser = (u) => u && {
    id: u.id, username: u.username, name: u.name, department: u.department,
    contact: u.contact, role: u.role, created_at: u.created_at,
  };
  const json = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
  const noContent = () => new Response(null, { status: 204 });

  async function mockRoute(method, path, query, body) {
    let m;

    // ── auth ──
    if (path === "/api/auth/login" && method === "POST") {
      const u = MOCK.users.find((x) => x.username === body.username && x.password === body.password);
      if (!u) return json({ error: "아이디 또는 비밀번호가 올바르지 않습니다." }, 401);
      MOCK.currentUserId = u.id;
      return json({ user: publicUser(u) });
    }
    if (path === "/api/auth/logout" && method === "POST") { MOCK.currentUserId = null; return noContent(); }
    if (path === "/api/auth/me" && method === "GET") {
      return json({ user: publicUser(MOCK.users.find((u) => u.id === MOCK.currentUserId)) || null });
    }
    if (path === "/api/auth/me" && method === "PATCH") {
      const u = MOCK.users.find((x) => x.id === MOCK.currentUserId);
      if (!u) return json({ error: "로그인이 필요합니다." }, 401);
      Object.assign(u, { name: body.name ?? u.name, department: body.department ?? u.department, contact: body.contact ?? u.contact });
      return json({ user: publicUser(u) });
    }

    // ── users (계정 관리) ──
    if (path === "/api/users" && method === "GET") return json(MOCK.users.map(publicUser));
    if (path === "/api/users" && method === "POST") {
      if (MOCK.users.some((u) => u.username === body.username)) return json({ error: "이미 존재하는 아이디입니다." }, 409);
      const u = {
        id: MOCK.users.length ? Math.max(...MOCK.users.map((x) => x.id)) + 1 : 1,
        username: body.username, password: body.password, name: body.name,
        department: body.department || "", contact: body.contact || "", role: body.role, created_at: nowIso(),
      };
      MOCK.users.push(u);
      return json(publicUser(u), 201);
    }
    if ((m = path.match(/^\/api\/users\/(\d+)$/)) && method === "PUT") {
      const u = MOCK.users.find((x) => x.id === Number(m[1]));
      if (!u) return json({ error: "계정을 찾을 수 없습니다." }, 404);
      if (body.username && body.username !== u.username && MOCK.users.some((x) => x.username === body.username && x.id !== u.id)) {
        return json({ error: "이미 존재하는 아이디입니다." }, 409);
      }
      Object.assign(u, {
        username: body.username ?? u.username, name: body.name ?? u.name, department: body.department ?? u.department,
        contact: body.contact ?? u.contact, role: body.role ?? u.role, password: body.password || u.password,
      });
      return json(publicUser(u));
    }
    if ((m = path.match(/^\/api\/users\/(\d+)$/)) && method === "DELETE") {
      const idNum = Number(m[1]);
      if (idNum === MOCK.currentUserId) return json({ error: "본인 계정은 삭제할 수 없습니다." }, 400);
      const before = MOCK.users.length;
      MOCK.users = MOCK.users.filter((x) => x.id !== idNum);
      if (MOCK.users.length === before) return json({ error: "계정을 찾을 수 없습니다." }, 404);
      return noContent();
    }

    // ── permits ──
    if (path === "/api/permits" && method === "GET") {
      let list = MOCK.permits;
      if (query.get("mine") === "1") list = list.filter((p) => p.createdByUserId === MOCK.currentUserId);
      return json(list);
    }
    if (path === "/api/permits" && method === "POST") {
      const p = { id: nextId("WP-2607"), ...body, status: "승인대기", createdByUserId: MOCK.currentUserId, signed: (body.workers || []).every((w) => w.signed) };
      MOCK.permits.unshift(p);
      return json(p, 201);
    }
    if ((m = path.match(/^\/api\/permits\/([^/]+)\/approve$/)) && method === "POST") {
      const p = MOCK.permits.find((x) => x.id === m[1]);
      if (!p) return json({ error: "허가서를 찾을 수 없습니다." }, 404);
      if (p.status !== "승인대기") return json({ error: "승인대기 상태의 허가서만 승인할 수 있습니다." }, 400);
      p.status = "진행중";
      return json(p);
    }
    if ((m = path.match(/^\/api\/permits\/([^/]+)\/reject$/)) && method === "POST") {
      const p = MOCK.permits.find((x) => x.id === m[1]);

      p.status = "반려";
      return json(p);
    }

    // ── alarms ──
    if (path === "/api/alarms" && method === "GET") return json(MOCK.alarms);

      if (!a) return json({ error: "알람을 찾을 수 없습니다." }, 404);
      a.ack = true;
      return json(a);
    }

      return json(l, 201);

      const d = { id: nextId("DOC"), category: body.category, title: body.title, content: body.content || "", updated_at: nowIso() };
      MOCK.documents.unshift(d);
      return json(d, 201);
    }
    if ((m = path.match(/^\/api\/documents\/([^/]+)$/)) && method === "DELETE") {
      MOCK.documents = MOCK.documents.filter((x) => x.id !== m[1]);
      return noContent();
    }

    // ── risk-assessments (목업: 조회만) ──
    if (path === "/api/risk-assessments" && method === "GET") return json(MOCK.riskAssessments);

    // ── trainings ──
    if (path === "/api/trainings" && method === "GET") return json(MOCK.trainings);
    if (path === "/api/trainings/completions" && method === "GET") {
      const name = query.get("name"), contact = query.get("contact");
      return json(
        MOCK.trainingCompletions
          .filter((c) => c.workerName === name && c.workerContact === contact)
          .map((c) => ({ trainingId: c.trainingId, completedAt: c.completedAt }))
      );
    }
    if ((m = path.match(/^\/api\/trainings\/([^/]+)\/complete$/)) && method === "POST") {
      const c = { trainingId: m[1], workerName: body.workerName, workerContact: body.workerContact, completedAt: nowIso() };
      MOCK.trainingCompletions.push(c);
      return json(c, 201);
    }

    // ── incidents ──
    if (path === "/api/incidents" && method === "GET") {
      let list = MOCK.incidents;
      const cat = query.get("category"), grade = query.get("grade");
      if (cat) list = list.filter((x) => x.category === cat);
      if (grade) list = list.filter((x) => x.grade === grade);
      return json(list);
    }
    if (path === "/api/incidents/stats" && method === "GET") {
      const byCategory = {}, byGrade = {}, byMonth = {};
      MOCK.incidents.forEach((i) => {
        byCategory[i.category] = (byCategory[i.category] || 0) + 1;
        byGrade[i.grade] = (byGrade[i.grade] || 0) + 1;
        const mon = (i.occurred_at || i.created_at || "").slice(0, 7);
        if (mon) byMonth[mon] = (byMonth[mon] || 0) + 1;
      });
      return json({
        byCategory: Object.entries(byCategory).map(([category, n]) => ({ category, n })),
        byGrade: Object.entries(byGrade).map(([grade, n]) => ({ grade, n })),
        byMonth: Object.entries(byMonth).sort().map(([month, n]) => ({ month, n })),
      });
    }
    if (path === "/api/incidents" && method === "POST") {
      const i = {
        id: nextId("INC", 4), category: body.category, grade: body.grade, site: body.site || "", type: body.type || "",
        description: body.description || "", occurred_at: body.occurredAt || null, reporter: body.reporter || "",
        status: "접수", created_at: nowIso(),
      };
      MOCK.incidents.unshift(i);
      const notified = body.grade === "A" || body.grade === "B" ? MOCK.notificationSettings.filter((s) => s.grade === body.grade) : [];
      return json({ ...i, notified }, 201);
    }

    // ── notifications ──
    if (path === "/api/notifications/settings" && method === "GET") return json(MOCK.notificationSettings);
    if (path === "/api/notifications/settings" && method === "POST") {
      const s = {
        id: MOCK.notificationSettings.length ? Math.max(...MOCK.notificationSettings.map((x) => x.id)) + 1 : 1,
        grade: body.grade, department: body.department, recipient_name: body.recipientName,
        recipient_contact: body.recipientContact, channel: body.channel || "kakao",
      };
      MOCK.notificationSettings.push(s);
      return json(s, 201);
    }
    if ((m = path.match(/^\/api\/notifications\/settings\/(\d+)$/)) && method === "DELETE") {
      MOCK.notificationSettings = MOCK.notificationSettings.filter((x) => x.id !== Number(m[1]));
      return noContent();
    }
    if (path === "/api/notifications/log" && method === "GET") return json(MOCK.notificationLogs);

    // ── emergency-contacts ──
    if (path === "/api/emergency-contacts" && method === "GET") {
      return json([...MOCK.emergencyContacts].sort((a, b) => a.sort_order - b.sort_order));
    }
    if (path === "/api/emergency-contacts" && method === "POST") {
      const maxOrder = MOCK.emergencyContacts.reduce((mx, c) => Math.max(mx, c.sort_order), 0);
      const c = {
        id: MOCK.emergencyContacts.length ? Math.max(...MOCK.emergencyContacts.map((x) => x.id)) + 1 : 1,
        name: body.name, role: body.role || "", phone: body.phone, category: body.category || "사내", sort_order: maxOrder + 1,
      };
      MOCK.emergencyContacts.push(c);
      return json(c, 201);
    }
    if ((m = path.match(/^\/api\/emergency-contacts\/(\d+)$/)) && method === "DELETE") {
      MOCK.emergencyContacts = MOCK.emergencyContacts.filter((x) => x.id !== Number(m[1]));
      return noContent();
    }

    // ── agent (AI 에이전트 — 실제 응답 대신 안내 문구를 타이핑 효과로 스트리밍) ──
    if (path === "/api/agent" && method === "POST") {
      const reply = "지금은 백엔드 없이 프론트엔드만 실행 중인 목업 모드입니다. 실제 AI 응답을 받으려면 서버(server/)를 실행한 뒤 http://localhost:3000 으로 접속해 주세요.";
      const stream = new ReadableStream({
        start(controller) {
          const enc = new TextEncoder();
          let i = 0;
          const timer = setInterval(() => {
            if (i >= reply.length) {
              controller.enqueue(enc.encode("data: [DONE]\n\n"));
              controller.close();
              clearInterval(timer);
              return;
            }
            const chunk = reply.slice(i, i + 3);
            i += 3;
            controller.enqueue(enc.encode(`data: ${JSON.stringify({ delta: chunk })}\n\n`));
          }, 30);
        },
      });
      return new Response(stream, { status: 200, headers: { "Content-Type": "text/event-stream" } });
    }

    return json({ error: `(목업) 지원하지 않는 요청: ${method} ${path}` }, 404);
  }

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : input.url;
    if (!url.startsWith("/api/")) return realFetch(input, init);
    const u = new URL(url, "http://mock.local");
    const method = (init && init.method) || "GET";
    let body = {};
    if (init && init.body) { try { body = JSON.parse(init.body); } catch (e) {} }
    await new Promise((r) => setTimeout(r, 120)); // 실제 네트워크처럼 약간의 지연
    return mockRoute(method, u.pathname, u.searchParams, body);
  };
}

function useIsMobile() {
  const [mobile, setMobile] = useState(
    typeof window !== "undefined" ? window.innerWidth < 768 : false
  );
  useEffect(() => {
    const onResize = () => setMobile(window.innerWidth < 768);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return mobile;
}

/* 기상청 여름철 체감온도 (2022 개정식)
   Stull 습구온도(Tw)를 이용한 기상청 공식 산식.
   폭염영향예보·폭염 단계 판정에 쓰이는 값과 동일 기준. */
function feelsLike(temp, humidity) {
  const Ta = temp, RH = Math.min(100, Math.max(0, humidity));
  if (Ta < 25) return +Ta.toFixed(1); // 여름철 산식 적용 범위 밖은 기온 그대로
  // Stull 습구온도(℃)
  const Tw =
    Ta * Math.atan(0.151977 * Math.sqrt(RH + 8.313659)) +
    Math.atan(Ta + RH) -
    Math.atan(RH - 1.67633) +
    0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH) -
    4.686035;
  const at =
    -0.2442 + 0.55399 * Tw + 0.45535 * Ta -
    0.0022 * Tw * Tw + 0.00278 * Tw * Ta + 3.0;
  return +Math.max(Ta, at).toFixed(1);
}

/* ───────────────────── 기상청 초단기실황 연동 (영종도, 서버 프록시) ─────────────────────
   공공데이터포털 기상청_단기예보 조회서비스 > 초단기실황(getUltraSrtNcst)
   영종도(인천 중구) 격자 좌표: nx=55, ny=124
   T1H=기온(℃), REH=습도(%). 매시 정각 관측 → 약 40분 후 제공(10분 주기 갱신).

   실제 호출은 서버(server/routes/weather.js)에서 수행합니다. 서버 .env의
   KMA_SERVICE_KEY 가 설정되지 않았거나 기상청 API 호출이 실패하면
   /api/weather 가 { live: false } 를 반환하고, 이 경우 가상 데이터로 대체됩니다.
──────────────────────────────────────────────────── */
async function fetchYeongjongTemp() {
  try {
    const res = await fetch("/api/weather");
    const json = await res.json();
    if (!json.live) return null;
    return { temp: json.temp, humidity: json.humidity };
  } catch (e) {
    return null;
  }
}

/* ───────────────────── 온도 피드 훅 (외부=기상청 / 내부=가상) ───────────────────── */
function useTempFeed() {
  const outdoor = useRef({ temp: 33, humidity: 62, live: false });
  const [live, setLive] = useState(false);

  const mk = (now, i, ext, intr, hum) => ({
    t: new Date(now - i * 5000).toLocaleTimeString("ko-KR", { hour12: false, minute: "2-digit", second: "2-digit" }),
    외부: +ext.toFixed(1), 내부: +intr.toFixed(1),
    습도: Math.round(hum), 체감: feelsLike(ext, hum),
  });

  const [data, setData] = useState(() => {
    const now = Date.now();
    const arr = [];
    let ext = 33, intr = 24, hum = 62;
    for (let i = 29; i >= 0; i--) {
      ext += (Math.random() - 0.5) * 0.6;
      intr += (Math.random() - 0.5) * 0.4;
      hum = Math.min(85, Math.max(40, hum + (Math.random() - 0.5) * 2));
      arr.push(mk(now, i, ext, intr, hum));
    }
    return arr;
  });

  // 기상청 실황 폴링 (5분 주기)
  useEffect(() => {
    let alive = true;
    const pull = async () => {
      try {
        const r = await fetchYeongjongTemp();
        if (alive && r) {
          outdoor.current = { temp: r.temp, humidity: r.humidity, live: true };
          setLive(true);
        }
      } catch (e) { /* CORS·키 오류 시 가상 유지 */ }
    };
    pull();
    const iv = setInterval(pull, 5 * 60 * 1000);
    return () => { alive = false; clearInterval(iv); };
  }, []);

  // 차트 갱신 (3초): 외부=실황값 유지(가상일 땐 완만한 변동), 내부=가상
  useEffect(() => {
    const iv = setInterval(() => {
      setData((prev) => {
        const last = prev[prev.length - 1];
        const o = outdoor.current;
        const ext = o.live
          ? o.temp + (Math.random() - 0.5) * 0.15
          : last.외부 + (Math.random() - 0.48) * 0.6;
        const hum = o.live ? o.humidity : Math.min(85, Math.max(40, last.습도 + (Math.random() - 0.5) * 2));
        const intr = last.내부 + (Math.random() - 0.5) * 0.4;
        return [...prev.slice(1), mk(Date.now(), 0, ext, intr, hum)];
      });
    }, 3000);
    return () => clearInterval(iv);
  }, []);

  return { data, live };
}

/* ───────────────────── AI 에이전트 ───────────────────── */
function AgentPanel({ open, onClose, permits, alarms, sentLinks }) {
  const isMobile = useIsMobile();
  const [msgs, setMsgs] = useState([
    { role: "assistant", content: "안전관제 에이전트입니다. 작업허가서 현황, 알람 분석, 위험구역 판단, 서명 미완료 건 확인 등 무엇이든 물어보세요." },
  ]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, busy]);

  const context = useMemo(() => ({
    현재시각: new Date().toLocaleString("ko-KR"),
    현장목록: SITES,
    작업허가서: permits,
    최근알람: (alarms || []).slice(0, 6),
    위험히트맵: { 구역: HEAT_ROWS, 항목: HEAT_COLS, 점수: HEAT },
    서명링크발송이력: sentLinks,
  }), [permits, alarms, sentLinks]);

  // 서버(/api/agent)가 Anthropic API를 대신 호출하고 SSE로 응답을 스트리밍합니다.
  // 브라우저는 API 키를 알지 못하며, 컨텍스트 주입 프롬프트도 서버에서 구성됩니다.
  const ask = async () => {
    const q = input.trim();
    if (!q || busy) return;
    const history = [...msgs, { role: "user", content: q }];
    setMsgs([...history, { role: "assistant", content: "" }]);
    setInput("");
    setBusy(true);

    const setLastAssistant = (content) => {
      setMsgs((m) => {
        const next = [...m];
        next[next.length - 1] = { role: "assistant", content };
        return next;
      });
    };

    try {
      const apiMessages = history.slice(1); // 첫 안내 메시지(assistant) 제외 — user로 시작
      const res = await fetch("/api/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages, context }),
      });
      if (!res.ok || !res.body) {
        const errJson = await res.json().catch(() => null);
        throw new Error(errJson?.error || "요청에 실패했습니다.");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let text = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          const payload = part.slice(6);
          if (payload === "[DONE]") continue;
          const evt = JSON.parse(payload);
          if (evt.error) throw new Error(evt.error);
          if (evt.delta) {
            text += evt.delta;
            setLastAssistant(text);
          }
        }
      }
      if (!text) setLastAssistant("응답을 받지 못했습니다. 다시 시도해 주세요.");
    } catch (e) {
      setLastAssistant(e.message || "네트워크 오류로 답변에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
      setBusy(false);
    }
  };

  if (!open) return null;

  const wrapStyle = isMobile
    ? {
        position: "fixed", inset: 0, zIndex: 100, background: T.panel2,
        display: "flex", flexDirection: "column",
      }
    : {
        width: 360, flexShrink: 0, borderLeft: `1px solid ${T.line}`, background: T.panel2,
        display: "flex", flexDirection: "column", height: "100%",
      };

  return (
    <div style={wrapStyle}>
      <div style={{ padding: "14px 16px", borderBottom: `1px solid ${T.line}`, display: "flex", alignItems: "center", gap: 10 }}>
        <Bot size={18} color={T.amber} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>안전관제 에이전트</div>
          <div style={{ fontSize: 11, color: T.muted, fontFamily: T.mono }}>대시보드 데이터 연동됨</div>
        </div>
        <button onClick={onClose} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 8 }}><X size={18} /></button>
      </div>
      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{
            alignSelf: m.role === "user" ? "flex-end" : "flex-start",
            maxWidth: "88%", padding: "10px 12px", borderRadius: 8, fontSize: 13, lineHeight: 1.55, whiteSpace: "pre-wrap",
            background: m.role === "user" ? `${T.amber}22` : T.panel,
            border: `1px solid ${m.role === "user" ? `${T.amber}44` : T.line}`,
          }}>{m.content}</div>
        ))}
        {busy && <div style={{ fontSize: 12, color: T.muted, fontFamily: T.mono }}>분석 중…</div>}
      </div>
      <div style={{
        padding: 12, borderTop: `1px solid ${T.line}`, display: "flex", gap: 8,
        paddingBottom: isMobile ? "calc(12px + env(safe-area-inset-bottom))" : 12,
      }}>
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && ask()}
          placeholder="예: 서명 안 된 허가서 알려줘"
          style={{
            flex: 1, background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6,
            color: T.text, padding: "12px", fontSize: 14, outline: "none", minWidth: 0,
          }}
        />
        <button onClick={ask} disabled={busy} style={{
          background: T.amber, border: "none", borderRadius: 6, width: 46, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", opacity: busy ? 0.5 : 1, flexShrink: 0,
        }}><Send size={16} color="#111" /></button>
      </div>
    </div>
  );
}

const siteStatusColor = (s) => (s === "경고" ? T.red : s === "주의" ? T.amber : T.green);

function Overview({ permits, alarms, temp }) {
  const isMobile = useIsMobile();
  const signal = useRiskSignal();
  // T는 렌더 시점 값을 in-place로 담고 있으므로, 매 렌더마다 새로 계산해야 테마 전환이 반영된다.
  const workTypeColors = [T.cyan, T.amber, T.red, T.green, "#C9A64A", "#5A4A7A"];
  const pending = permits.filter((p) => p.status === "승인대기").length;
  const active = permits.filter((p) => p.status === "진행중").length;
  const unack = alarms.filter((a) => !a.ack).length;
  const lastTemp = temp[temp.length - 1];

  const workTypeCounts = useMemo(() => {
    const m = {};
    permits.forEach((p) => { m[p.type] = (m[p.type] || 0) + 1; });
    return Object.entries(m).map(([type, cnt]) => ({ type, cnt }));
  }, [permits]);

  const siteActiveCounts = useMemo(() => {
    const m = {};
    permits.forEach((p) => { if (p.status === "진행중") m[p.site] = (m[p.site] || 0) + 1; });
    return m;
  }, [permits]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(auto-fit, minmax(170px, 1fr))", gap: 10 }}>

        <Kpi label="체감온도(옥외)" value={`${lastTemp.체감}°C`} sub={heatStage(lastTemp.체감).label} color={heatStage(lastTemp.체감).color} />

      </div>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 14 }}>
        <Panel title="작업 유형별 현황" right={<Badge color={T.cyan}>{permits.length}건</Badge>}>
          {workTypeCounts.length === 0 ? (
            <div style={{ color: T.muted, fontSize: 13 }}>등록된 작업허가서가 없습니다.</div>
          ) : (
            <div style={{ height: 190 }}>
              <ResponsiveContainer>
                <BarChart data={workTypeCounts}>
                  <CartesianGrid stroke={T.line} vertical={false} />
                  <XAxis dataKey="type" stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} />
                  <YAxis stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} width={24} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, fontSize: 12 }} />
                  <Bar dataKey="cnt" name="건수" radius={[3, 3, 0, 0]}>
                    {workTypeCounts.map((d, i) => (
                      <Cell key={i} fill={workTypeColors[i % workTypeColors.length]} />

                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}
        </Panel>
        <Panel title="작업 위치 현황">
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {SITES.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "9px 12px", flexWrap: "wrap" }}>

                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{s.name}</div>

                </div>
              </div>
            ))}
          </div>
        </Panel>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 14 }}>
        <Panel title="최근 7일 알람 발생">
          <div style={{ height: 190 }}>
            <ResponsiveContainer>
              <BarChart data={ALARM_WEEK}>
                <CartesianGrid stroke={T.line} vertical={false} />
                <XAxis dataKey="day" stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} />
                <YAxis stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} width={24} />
                <Tooltip contentStyle={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, fontSize: 12 }} />

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>

                </div>

          </div>
        </Panel>
      </div>
    </div>
  );
}

    return T.green;
  };
  return (
    <Panel title="구역별 위험 히트맵 (0–100)" right={<Badge color={T.red}>최고 88 · BOH 질식(주방덕트)</Badge>}>
      <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
        <div style={{
          display: "grid",
          gridTemplateColumns: `72px repeat(${HEAT_COLS.length}, minmax(76px, 1fr))`,
          gap: 5, minWidth: 480,

            <div key={c} style={{ textAlign: "center", fontSize: 11, color: T.muted, fontFamily: T.mono, paddingBottom: 4 }}>{c}</div>

              <div style={{ fontSize: 11, color: T.muted, fontFamily: T.mono, display: "flex", alignItems: "center" }}>{r}</div>

                const c = cellColor(v);
                return (
                  <div key={ci} title={`${r} · ${HEAT_COLS[ci]}: ${v}`} style={{
                    background: `${c}${Math.round(30 + (v / 100) * 60).toString(16).padStart(2, "0")}`,
                    border: `1px solid ${c}66`, borderRadius: 5, height: 48,

function SignaturePad({ title, onSave, onClose }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    const c = canvasRef.current;
    const dpr = window.devicePixelRatio || 1;
    const rect = c.getBoundingClientRect();
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = "#F2EFE9";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = (e) => {
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.beginPath(); ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.lineTo(x, y); ctx.stroke();
    setDirty(true);
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.restore();
    setDirty(false);
  };

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.7)",
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div style={{
        width: "100%", maxWidth: 440, background: T.panel, border: `1px solid ${T.line}`,
        borderRadius: 10, overflow: "hidden",
      }}>
        <div style={{ padding: "14px 16px", borderBottom: `1px solid ${T.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{title} 서명</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>아래 영역에 손가락 또는 마우스로 서명하세요</div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 6 }}><X size={18} /></button>
        </div>
        <div style={{ padding: 16 }}>
          <canvas
            ref={canvasRef}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
            style={{
              width: "100%", height: 180, background: T.bg,
              border: `1px dashed ${T.line}`, borderRadius: 8,
              touchAction: "none", display: "block", cursor: "crosshair",
            }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button onClick={clear} style={{
              flex: 1, background: "none", border: `1px solid ${T.line}`, borderRadius: 6,
              color: T.muted, padding: "12px 0", fontSize: 13, cursor: "pointer",
            }}>지우기</button>
            <button
              disabled={!dirty}
              onClick={() => onSave(canvasRef.current.toDataURL("image/png"))}
              style={{
                flex: 2, background: dirty ? T.green : T.line, border: "none", borderRadius: 6,
                color: "#0B0F14", padding: "12px 0", fontSize: 14, fontWeight: 700,
                cursor: dirty ? "pointer" : "default",
              }}
            >서명 저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, required, children, span }) {
  return (
    <div style={{ gridColumn: span ? "1 / -1" : "auto" }}>
      <label style={{ fontSize: 12, color: T.muted, display: "block", marginBottom: 6 }}>
        {label} {required && <span style={{ color: T.red }}>*</span>}
      </label>
      {children}
    </div>
  );
}

function PermitForm({ onSubmit }) {
  const isMobile = useIsMobile();
  const inp = {
    width: "100%", background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6,
    color: T.text, padding: "11px 12px", fontSize: 13, outline: "none", boxSizing: "border-box",
  };
  const empty = {
    site: SITES[0].name, location: "", desc: "", start: "", end: "",
    supervisor: "", worker: "", contact: "", headcount: 1,
    company: "", bizno: "", purpose: "", equipment: "",
    o2: "", lel: "", co: "", watcher: "",
  };
  const [formType, setFormType] = useState("general");
  const [f, setF] = useState(empty);
  const [kinds, setKinds] = useState([]);
  const [checks, setChecks] = useState([]);
  const [err, setErr] = useState(null);
  const [workers, setWorkers] = useState([{ name: "", contact: "", sig: null }]);
  const [sigTarget, setSigTarget] = useState(null); // 작업자 서명패드 대상 index
  // 승인 서명: 인스파이어 책임자 / 인스파이어 담당자 / 공사업체 책임자
  const [approvals, setApprovals] = useState({
    inspireManager: { name: "", sig: null },
    inspireStaff: { name: "", sig: null },
    contractor: { name: "", sig: null },
  });
  const [apprSigTarget, setApprSigTarget] = useState(null); // 승인 서명패드 대상 key
  const [raTemplates, setRaTemplates] = useState([]);
  const [trainingErr, setTrainingErr] = useState(null);

  // 표준 위험성평가 템플릿 — 작업허가서 제출 시 작업유형에 맞춰 자동 별첨
  useEffect(() => { fetch("/api/risk-assessments").then((r) => r.json()).then(setRaTemplates); }, []);

  // 서명 전 필수 안전교육(공통) 이수 여부 확인 — 미이수 시 현장 서명 차단
  const openSign = (i) => {
    setTrainingErr(null);
    const w = workers[i];
    if (!w.name.trim() || !w.contact.trim()) {
      setTrainingErr("서명 전 작업자 성명과 연락처를 먼저 입력하세요.");
      return;
    }
    fetch(`/api/trainings/completions?name=${encodeURIComponent(w.name)}&contact=${encodeURIComponent(w.contact)}`)
      .then((r) => r.json())
      .then((rows) => {
        if (rows.length === 0) {
          setTrainingErr(`${w.name}님은 필수 안전교육 이수 내역이 없습니다. "교육" 탭에서 먼저 이수해야 서명할 수 있습니다.`);
          return;
        }
        setSigTarget(i);
      })
      .catch(() => setSigTarget(i)); // 조회 실패 시(오프라인 등) 서명 자체는 막지 않음

  };

  const APPROVAL_ROLES = [
    { key: "inspireManager", label: "인스파이어 책임자", hint: "구역 안전책임자 (발급 승인)" },
    { key: "inspireStaff", label: "인스파이어 담당자", hint: "현장 확인·입회 담당" },
    { key: "contractor", label: "공사업체 책임자", hint: "시공/작업 수행 업체" },
  ];
  const setApproval = (key, patch) => setApprovals((prev) => ({ ...prev, [key]: { ...prev[key], ...patch } }));

  const setWorker = (i, k, v) => setWorkers((prev) => prev.map((w, idx) => (idx === i ? { ...w, [k]: v } : w)));
  const addWorker = () => setWorkers((prev) => [...prev, { name: "", contact: "", sig: null }]);
  const removeWorker = (i) => setWorkers((prev) => (prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev));

  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const toggle = (arr, setArr, v) => setArr(arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  const switchType = (t) => {
    setFormType(t); setKinds([]); setChecks([]); setErr(null);
    setApprovals({ inspireManager: { name: "", sig: null }, inspireStaff: { name: "", sig: null }, contractor: { name: "", sig: null } });
  };

  const submit = () => {
    if (!f.desc.trim()) return setErr("작업 내용을 입력하세요.");
    if (!f.start || !f.end) return setErr("작업 시작/종료 일시를 입력하세요.");
    if (!f.worker.trim() || !f.contact.trim()) return setErr("작업(행사) 책임자 성명과 연락처를 입력하세요.");
    if (workers.some((w) => !w.name.trim() || !w.contact.trim()))
      return setErr("모든 작업자의 성명과 연락처를 빠짐없이 기입하세요. 미기입 작업자는 허가서에 등재할 수 없습니다.");
    if (formType === "hazard" && kinds.length === 0) return setErr("위험작업 종류를 1개 이상 선택하세요.");
    if (formType === "rental" && !f.company.trim()) return setErr("임대(대관) 업체명을 입력하세요.");
    const required = FORM_CHECKS[formType];
    if (checks.length < required.length) return setErr("모든 안전조치 확인 항목에 체크해야 발급 신청이 가능합니다.");
    for (const r of APPROVAL_ROLES) {
      if (!approvals[r.key].name.trim()) return setErr(`${r.label} 성명을 입력하세요.`);
      if (!approvals[r.key].sig) return setErr(`${r.label} 서명이 필요합니다.`);
    }

    const typeLabel =
      formType === "general" ? "일반작업" :
      formType === "rental" ? "임대·대관" :
      kinds[0] + (kinds.length > 1 ? ` 외 ${kinds.length - 1}` : "");
    onSubmit({
      type: typeLabel,
      site: formType === "rental" ? `${f.site} / ${f.company}` : f.site,
      worker: f.worker, contact: f.contact,
      workers: workers.map((w) => ({ name: w.name.trim(), contact: w.contact.trim(), signed: !!w.sig, sig: w.sig })),
      approvals: {
        inspireManager: { ...approvals.inspireManager },
        inspireStaff: { ...approvals.inspireStaff },
        contractor: { ...approvals.contractor },
      },
      start: f.start.slice(5).replace("T", " "), end: f.end.slice(5).replace("T", " "),
      detail: { formType, ...f, kinds, checks },
    });
    setF(empty); setKinds([]); setChecks([]); setWorkers([{ name: "", contact: "", sig: null }]);
    setApprovals({ inspireManager: { name: "", sig: null }, inspireStaff: { name: "", sig: null }, contractor: { name: "", sig: null } });
    setErr(null);
  };

  const cur = FORM_TYPES.find((t) => t.key === formType);
  const grid2 = { display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 12 };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, maxWidth: 860 }}>
      {/* 허가서 종류 선택 */}
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr", gap: 10 }}>
        {FORM_TYPES.map((t) => (
          <button key={t.key} onClick={() => switchType(t.key)} style={{
            textAlign: "left", padding: 14, borderRadius: 8, cursor: "pointer",
            background: formType === t.key ? `${T.amber}14` : T.panel,
            border: `1px solid ${formType === t.key ? T.amber : T.line}`,
            color: T.text,
          }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: formType === t.key ? T.amber : T.text }}>{t.label}</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 6, lineHeight: 1.5 }}>{t.desc}</div>
          </button>
        ))}
      </div>

      <Panel title={`${cur.label} 작성`} right={<Badge color={T.cyan}>KOSHA GUIDE P-94 기반</Badge>}>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

          {/* 기본 정보 */}
          <div style={grid2}>
            <Field label="대상 현장" required>
              <select value={f.site} onChange={set("site")} style={inp}>
                {SITES.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
              </select>
            </Field>
            <Field label={formType === "rental" ? "대관 시설/구역" : "작업 장소 (상세)"} required>
              <input value={f.location} onChange={set("location")} placeholder={formType === "rental" ? "예: Rotunda 대관 행사장" : "예: BOH 주방덕트 / Rotunda 천장부"} style={inp} />
            </Field>
            <Field label={formType === "rental" ? "사용 목적 및 작업(행사) 내용" : "작업 내용"} required span>
              <textarea value={f.desc} onChange={set("desc")} rows={3} placeholder="작업 범위, 방법, 사용 장비 등을 구체적으로 기재" style={{ ...inp, resize: "vertical", fontFamily: "inherit" }} />
            </Field>
            <Field label="시작 일시" required>
              <input type="datetime-local" value={f.start} onChange={set("start")} style={inp} />
            </Field>
            <Field label="종료 일시" required>
              <input type="datetime-local" value={f.end} onChange={set("end")} style={inp} />
            </Field>
          </div>

          {/* 임대·대관 전용 */}
          {formType === "rental" && (
            <div style={grid2}>
              <Field label="임대(대관) 업체명" required>
                <input value={f.company} onChange={set("company")} placeholder="예: (주)한빛이엔지" style={inp} />
              </Field>
              <Field label="사업자등록번호">
                <input value={f.bizno} onChange={set("bizno")} placeholder="000-00-00000" style={inp} />
              </Field>
              <Field label="반입 장비/물품" span>
                <input value={f.equipment} onChange={set("equipment")} placeholder="예: 음향장비 1식, 이동식 리프트 1대" style={inp} />
              </Field>
            </div>
          )}

          {/* 위험작업 전용 */}
          {formType === "hazard" && (
            <>
              <div>
                <div style={{ fontSize: 12, color: T.muted, marginBottom: 8 }}>위험작업 종류 <span style={{ color: T.red }}>*</span> (복수 선택 가능 — 보충작업허가 병행)</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {HAZARD_KINDS.map((k) => (
                    <button key={k} onClick={() => toggle(kinds, setKinds, k)} style={{
                      padding: "8px 14px", borderRadius: 20, fontSize: 13, cursor: "pointer",
                      background: kinds.includes(k) ? `${T.red}22` : T.bg,
                      border: `1px solid ${kinds.includes(k) ? T.red : T.line}`,
                      color: kinds.includes(k) ? T.red : T.muted,
                    }}>{k}</button>
                  ))}
                </div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 12 }}>
                <Field label="산소농도 (%)"><input value={f.o2} onChange={set("o2")} placeholder="18.0~23.5" style={inp} /></Field>
                <Field label="가연성가스 (%LEL)"><input value={f.lel} onChange={set("lel")} placeholder="< 10" style={inp} /></Field>
                <Field label="CO (ppm)"><input value={f.co} onChange={set("co")} placeholder="< 30" style={inp} /></Field>
                <Field label="감시인 성명"><input value={f.watcher} onChange={set("watcher")} placeholder="감시인/화기감시자" style={inp} /></Field>
              </div>
            </>
          )}

          {/* 표준 위험성평가 자동 별첨 — 선택한 작업유형에 맞춰 자동으로 첨부되어 누락을 방지 */}
          {(() => {
            const matched = formType === "hazard"
              ? raTemplates.filter((t) => kinds.includes(t.workType))
              : raTemplates.filter((t) => t.workType === "일반작업");
            if (matched.length === 0) return null;
            return (
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <ClipboardList size={15} color={T.cyan} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>자동 별첨된 표준 위험성평가</span>
                  <Badge color={T.cyan}>자동첨부</Badge>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 10 }}>
                  {matched.map((t) => (
                    <div key={t.id} style={{ background: T.bg, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T.cyan, marginBottom: 6 }}>{t.title}</div>
                      {t.items.map((it, i) => (
                        <div key={i} style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
                          <span style={{ color: T.red }}>⚠ {it.hazard}</span> → {it.measure}
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          {/* 작업 책임자 */}
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 12 }}>
            <Field label={formType === "rental" ? "행사(작업) 책임자" : "작업 책임자"} required>
              <input value={f.worker} onChange={set("worker")} placeholder="성명" style={inp} />
            </Field>
            <Field label="책임자 연락처" required>
              <input value={f.contact} onChange={set("contact")} placeholder="010-0000-0000" style={inp} />
            </Field>
          </div>

          {/* 작업자 명단 (성명·연락처·서명 필수) */}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600 }}>작업자 명단 <span style={{ color: T.red }}>*</span></span>
              <span style={{ fontSize: 11, color: T.muted }}>전원 성명·연락처 필수 기입 · 서명은 현장 서명 또는 서명링크 발송으로 완료</span>
              <span style={{ marginLeft: "auto", fontSize: 11, fontFamily: T.mono, color: T.muted }}>
                총 {workers.length}명 · 서명 {workers.filter((w) => w.sig).length}명
              </span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {workers.map((w, i) => (
                <div key={i} style={{
                  display: "grid",
                  gridTemplateColumns: isMobile ? "1fr" : "32px 1fr 1fr 130px 36px",
                  gap: 8, alignItems: "center",
                  background: T.bg, border: `1px solid ${w.sig ? `${T.green}55` : T.line}`,
                  borderRadius: 8, padding: 10,
                }}>
                  <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, textAlign: isMobile ? "left" : "center" }}>{i + 1}</span>
                  <input
                    value={w.name}
                    onChange={(e) => setWorker(i, "name", e.target.value)}
                    placeholder="작업자 성명"
                    style={{ ...inp, background: T.panel2 }}
                  />
                  <input
                    value={w.contact}
                    onChange={(e) => setWorker(i, "contact", e.target.value)}
                    placeholder="연락처 010-0000-0000"
                    style={{ ...inp, background: T.panel2 }}
                  />
                  {w.sig ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <img src={w.sig} alt={`${w.name} 서명`} style={{
                        height: 34, maxWidth: 90, background: "#FFFFFF10",
                        border: `1px solid ${T.green}44`, borderRadius: 4, objectFit: "contain",
                      }} />
                      <button onClick={() => setWorker(i, "sig", null)} title="서명 다시하기" style={{
                        background: "none", border: "none", color: T.muted, cursor: "pointer", fontSize: 11,
                      }}>재서명</button>
                    </div>
                  ) : (
                    <button onClick={() => openSign(i)} style={{
                      background: `${T.cyan}14`, border: `1px solid ${T.cyan}55`, color: T.cyan,
                      borderRadius: 6, padding: "9px 0", fontSize: 12, cursor: "pointer",
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
                    }}><PenLine size={13} /> 현장 서명</button>
                  )}
                  <button onClick={() => removeWorker(i)} disabled={workers.length === 1} title="행 삭제" style={{
                    background: "none", border: `1px solid ${T.line}`, borderRadius: 6,
                    color: workers.length === 1 ? T.line : T.muted, cursor: workers.length === 1 ? "default" : "pointer",
                    height: 34, display: "flex", alignItems: "center", justifyContent: "center",
                  }}><X size={14} /></button>
                </div>
              ))}
            </div>
            <button onClick={addWorker} style={{
              marginTop: 8, width: "100%", background: "none", border: `1px dashed ${T.line}`,
              borderRadius: 8, color: T.muted, padding: "11px 0", fontSize: 13, cursor: "pointer",
            }}>+ 작업자 추가</button>
            {trainingErr && (
              <div style={{
                display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", marginTop: 8,
                background: `${T.red}14`, border: `1px solid ${T.red}55`, borderRadius: 6, fontSize: 12, color: T.red,
              }}><CircleAlert size={14} /> {trainingErr}</div>
            )}
            <div style={{ fontSize: 11, color: T.muted, marginTop: 8, lineHeight: 1.5 }}>
              현장에서 서명하지 못한 작업자는 허가서 등록 후 <b style={{ color: T.amber }}>서명링크</b> 탭에서 각 작업자의 연락처로 전자서명 링크를 발송할 수 있습니다.
              서명 전 <b style={{ color: T.amber }}>작업자 교육</b> 탭에서 필수 안전교육 이수가 필요합니다.
            </div>
          </div>

          {sigTarget !== null && (
            <SignaturePad
              title={workers[sigTarget]?.name || `작업자 ${sigTarget + 1}`}
              onClose={() => setSigTarget(null)}
              onSave={(dataUrl) => { setWorker(sigTarget, "sig", dataUrl); setSigTarget(null); }}
            />
          )}

          {/* 승인 서명: 인스파이어 책임자 / 담당자 / 공사업체 책임자 */}
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <PenLine size={15} color={T.amber} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>승인 서명 <span style={{ color: T.red }}>*</span></span>
              <span style={{ fontSize: 11, color: T.muted }}>인스파이어 2인 + 공사업체 책임자 서명 필수</span>
              <span style={{ marginLeft: "auto", fontSize: 11, fontFamily: T.mono, color: T.muted }}>
                {APPROVAL_ROLES.filter((r) => approvals[r.key].sig).length}/3 서명
              </span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr", gap: 10 }}>
              {APPROVAL_ROLES.map((r) => {
                const a = approvals[r.key];
                const inspire = r.key !== "contractor";
                const accent = inspire ? T.amber : T.cyan;
                return (
                  <div key={r.key} style={{
                    background: T.bg, border: `1px solid ${a.sig ? `${T.green}55` : T.line}`,
                    borderRadius: 8, padding: 12, display: "flex", flexDirection: "column", gap: 10,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 6, height: 6, borderRadius: "50%", background: accent }} />
                      <span style={{ fontSize: 13, fontWeight: 700 }}>{r.label}</span>
                    </div>
                    <div style={{ fontSize: 11, color: T.muted, marginTop: -4 }}>{r.hint}</div>
                    <input
                      value={a.name}
                      onChange={(e) => setApproval(r.key, { name: e.target.value })}
                      placeholder="성명"
                      style={{ ...inp, background: T.panel2 }}
                    />
                    {a.sig ? (
                      <div style={{
                        display: "flex", alignItems: "center", justifyContent: "space-between",
                        background: "#FFFFFF08", border: `1px solid ${T.green}44`, borderRadius: 6, padding: "6px 8px",
                      }}>
                        <img src={a.sig} alt={`${r.label} 서명`} style={{ height: 40, maxWidth: "70%", objectFit: "contain" }} />

/* ───────────────────── 위험수준 신호등 · 작업구역 도면 ───────────────────── */
function useRiskSignal() {
  const [signal, setSignal] = useState(null);
  useEffect(() => {
    let alive = true;
    const pull = () => fetch("/api/risk-signal").then((r) => r.json()).then((d) => { if (alive) setSignal(d); }).catch(() => {});
    pull();
    const iv = setInterval(pull, 60000);
    return () => { alive = false; clearInterval(iv); };
  }, []);
  return signal;
}

const riskColor = (level) => (level === "red" ? T.red : level === "yellow" ? T.amber : T.green);

function RiskSignalBanner({ signal }) {
  if (!signal) return <div style={{ color: T.muted, fontSize: 13 }}>위험수준 신호등을 불러오는 중…</div>;
  const color = riskColor(signal.level);
  return (
    <div style={{
      background: `${color}12`, border: `1px solid ${color}66`, borderRadius: 10, padding: 16,
      display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap",
    }}>
      <span style={{
        width: 16, height: 16, borderRadius: "50%", background: color, boxShadow: `0 0 10px ${color}`, flexShrink: 0,
        animation: signal.level !== "green" ? "safeops-pulse 1.4s ease-in-out infinite" : "none",
      }} />
      <div style={{ minWidth: 160 }}>
        <div style={{ fontSize: 11, color: T.muted, fontFamily: T.mono }}>금일 위험수준 신호등 · {signal.date}</div>
        <div style={{ fontSize: 22, fontWeight: 700, color }}>{signal.label}</div>
      </div>
      <div style={{ fontSize: 12, color: T.text, lineHeight: 1.7, flex: 1, minWidth: 200 }}>
        {signal.reasons.map((r, i) => <div key={i}>· {r}</div>)}
      </div>
    </div>
  );
}

// 실제 시설 도면 이미지가 public/assets/floorplan.png 에 준비되면 자동으로 도면+마커 모드로 전환된다.
// 이미지가 없으면 SITES 카드 그리드에 위험 표시(깜빡임)로 대체된다.
function FloorPlan({ zones }) {
  const [imgOk, setImgOk] = useState(true);
  const hazardBySite = useMemo(() => {
    const m = {};
    (zones || []).forEach((z) => { m[z.site] = z.hazardCount; });
    return m;
  }, [zones]);

  if (imgOk) {
    return (
      <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", background: T.panel2, border: `1px solid ${T.line}` }}>
        <img
          src="assets/floorplan.png"
          alt="시설 도면"
          onError={() => setImgOk(false)}
          style={{ width: "100%", display: "block" }}
        />
        {SITES.filter((s) => s.x != null && s.y != null).map((s) => {
          const active = (hazardBySite[s.name] || 0) > 0;
          const color = active ? T.red : T.green;
          return (
            <div key={s.id} title={`${s.name}${active ? ` · 위험작업 ${hazardBySite[s.name]}건` : ""}`} style={{
              position: "absolute", left: `${s.x}%`, top: `${s.y}%`, transform: "translate(-50%, -50%)",
              width: 16, height: 16, borderRadius: "50%", background: color, border: "2px solid #fff",
              animation: active ? "safeops-pulse 1s ease-in-out infinite" : "none",
            }} />
          );
        })}
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 10 }}>
        {SITES.map((s) => {
          const active = (hazardBySite[s.name] || 0) > 0;
          return (
            <div key={s.id} style={{
              background: T.panel, border: `1px solid ${active ? T.red : T.line}`, borderRadius: 8, padding: 12,
              animation: active ? "safeops-pulse-border 1.2s ease-in-out infinite" : "none",
            }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{s.name}</div>
              <div style={{ fontSize: 11, color: active ? T.red : T.muted, marginTop: 4 }}>
                {active ? `위험작업 ${hazardBySite[s.name]}건 진행 중` : "정상"}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ fontSize: 11, color: T.muted }}>
        ※ 실제 시설 도면 이미지를 public/assets/floorplan.png 경로에 배치하면 도면 기반 좌표 표시로 자동 전환됩니다.
      </div>
    </div>
  );
}

const DOC_CATEGORIES = ["안전보건관리체계", "비상대응매뉴얼", "기타"];

function Documents({ user }) {
  const isMobile = useIsMobile();
  const canEdit = can(user, "editContent");
  const [docs, setDocs] = useState([]);
  const [filter, setFilter] = useState("전체");
  const [selected, setSelected] = useState(null);
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ category: DOC_CATEGORIES[0], title: "", content: "" });

  const load = () => fetch("/api/documents").then((r) => r.json()).then(setDocs);
  useEffect(() => { load(); }, []);

  const list = filter === "전체" ? docs : docs.filter((d) => d.category === filter);
  const inp = { background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: 8, fontSize: 13, outline: "none" };

  const submit = () => {
    if (!form.title.trim()) return;
    fetch("/api/documents", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form) })
      .then((r) => r.json())
      .then(() => { setForm({ category: DOC_CATEGORIES[0], title: "", content: "" }); setAdding(false); load(); });
  };

  const remove = (id) => fetch(`/api/documents/${id}`, { method: "DELETE" }).then(() => { setSelected(null); load(); });

  return (
    <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "320px 1fr", gap: 14, alignItems: "start" }}>
      <Panel title="문서함" right={canEdit && (
        <button onClick={() => setAdding((v) => !v)} style={{
          background: "none", border: `1px solid ${T.amber}66`, color: T.amber, borderRadius: 4,
          padding: "4px 10px", fontSize: 12, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4,
        }}><Plus size={13} /> 문서 등록</button>
      )}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {["전체", ...DOC_CATEGORIES].map((c) => (
            <button key={c} onClick={() => setFilter(c)} style={{
              background: filter === c ? `${T.amber}22` : "none",
              border: `1px solid ${filter === c ? T.amber : T.line}`, color: filter === c ? T.amber : T.muted,
              borderRadius: 4, padding: "4px 10px", fontSize: 11, cursor: "pointer",
            }}>{c}</button>
          ))}
        </div>
        {adding && (
          <div style={{ background: T.bg, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, marginBottom: 10, display: "flex", flexDirection: "column", gap: 8 }}>

            <textarea value={form.content} onChange={(e) => setForm((f) => ({ ...f, content: e.target.value }))} placeholder="본문 내용" rows={4} style={{ ...inp, resize: "vertical", fontFamily: "inherit" }} />
            <button onClick={submit} style={{ background: T.amber, border: "none", borderRadius: 6, padding: "9px 0", fontWeight: 700, cursor: "pointer" }}>등록</button>
          </div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {list.map((d) => (
            <button key={d.id} onClick={() => setSelected(d)} style={{
              textAlign: "left", background: selected?.id === d.id ? `${T.amber}14` : T.bg,
              border: `1px solid ${selected?.id === d.id ? T.amber : T.line}`, borderRadius: 6, padding: 10, cursor: "pointer",
            }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{d.title}</div>
              <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>{d.category} · {(d.updated_at || "").slice(0, 10)}</div>
            </button>
          ))}
          {list.length === 0 && <div style={{ color: T.muted, fontSize: 13 }}>등록된 문서가 없습니다.</div>}
        </div>
      </Panel>
      <Panel title={selected ? selected.title : "문서 미리보기"} right={selected && canEdit && (
        <button onClick={() => remove(selected.id)} style={{ background: "none", border: "none", color: T.red, cursor: "pointer" }}><Trash2 size={15} /></button>
      )}>
        {selected
          ? <div style={{ whiteSpace: "pre-wrap", fontSize: 13, lineHeight: 1.8, color: T.text }}>{selected.content}</div>
