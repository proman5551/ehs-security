function Training({ user }) {
  const isMobile = useIsMobile();
  const canComplete = can(user, "issuePermit");
  const [trainings, setTrainings] = useState([]);
  const [active, setActive] = useState(null);
  const [checked, setChecked] = useState([]);
  const [worker, setWorker] = useState({ name: "", contact: "" });
  const [msg, setMsg] = useState(null);
  const [lookup, setLookup] = useState({ name: "", contact: "", result: null });

  useEffect(() => { fetch("/api/trainings").then((r) => r.json()).then(setTrainings); }, []);

  const inp = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: "10px 12px", fontSize: 13, outline: "none" };

  const start = (t) => { setActive(t); setChecked([]); setMsg(null); };
  const toggleCheck = (idx) => setChecked((c) => (c.includes(idx) ? c.filter((x) => x !== idx) : [...c, idx]));

  const complete = () => {
    if (!worker.name.trim() || !worker.contact.trim()) return setMsg("이름과 연락처를 입력하세요.");
    if (checked.length < active.checklist.length) return setMsg("모든 확인 항목에 체크해야 이수 완료됩니다.");
    fetch(`/api/trainings/${active.id}/complete`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ workerName: worker.name, workerContact: worker.contact }),
    }).then((r) => r.json()).then(() => {
      setMsg(null);
      setActive(null); setChecked([]); setWorker({ name: "", contact: "" });
    });
  };

  const checkLookup = () => {
    if (!lookup.name.trim() || !lookup.contact.trim()) return;
    fetch(`/api/trainings/completions?name=${encodeURIComponent(lookup.name)}&contact=${encodeURIComponent(lookup.contact)}`)
      .then((r) => r.json()).then((rows) => setLookup((l) => ({ ...l, result: rows })));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Panel title="교육 이수 확인 조회">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <input value={lookup.name} onChange={(e) => setLookup((l) => ({ ...l, name: e.target.value }))} placeholder="성명" style={{ ...inp, flex: 1, minWidth: 120 }} />
          <input value={lookup.contact} onChange={(e) => setLookup((l) => ({ ...l, contact: e.target.value }))} placeholder="연락처" style={{ ...inp, flex: 1, minWidth: 140 }} />
          <button onClick={checkLookup} style={{ background: T.cyan, border: "none", borderRadius: 6, padding: "10px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>조회</button>
        </div>
        {lookup.result && (
          <div style={{ marginTop: 10, fontSize: 12, display: "flex", gap: 6, flexWrap: "wrap" }}>
            {lookup.result.length === 0
              ? <span style={{ color: T.red }}>이수 내역이 없습니다.</span>
              : lookup.result.map((r, i) => <Badge key={i} color={T.green}>{r.trainingId}</Badge>)}
          </div>
        )}
      </Panel>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill, minmax(300px, 1fr))", gap: 12 }}>
        {trainings.map((t) => (
          <Panel key={t.id} title={t.title} right={<Badge color={T.cyan}>{t.category}</Badge>}>
            <div style={{ fontSize: 13, color: T.text, lineHeight: 1.6, marginBottom: 10 }}>{t.content}</div>
            <div style={{ fontSize: 11, color: T.muted, marginBottom: 8 }}>확인 항목 {t.checklist.length}개 · 서류 기반(퀴즈 선택)</div>
            {canComplete && (
              <button onClick={() => start(t)} style={{
                width: "100%", background: `${T.amber}18`, border: `1px solid ${T.amber}66`, color: T.amber,
                borderRadius: 6, padding: "10px 0", fontSize: 13, cursor: "pointer",
              }}>교육 이수 진행</button>
            )}
          </Panel>
        ))}
      </div>

      {active && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
          <div style={{ width: "100%", maxWidth: 480, background: T.panel, border: `1px solid ${T.line}`, borderRadius: 10, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ padding: 16, borderBottom: `1px solid ${T.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{active.title}</div>
              <button onClick={() => setActive(null)} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer" }}><X size={18} /></button>
            </div>
            <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ fontSize: 13, color: T.text, lineHeight: 1.6 }}>{active.content}</div>
              {active.checklist.map((c, i) => (
                <label key={i} style={{
                  display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 12px",
                  background: checked.includes(i) ? `${T.green}10` : T.bg,
                  border: `1px solid ${checked.includes(i) ? `${T.green}55` : T.line}`, borderRadius: 6, fontSize: 13, cursor: "pointer",
                }}>
                  <input type="checkbox" checked={checked.includes(i)} onChange={() => toggleCheck(i)} style={{ accentColor: T.green, marginTop: 2 }} />
                  {c}
                </label>
              ))}
              {active.quiz && <div style={{ fontSize: 11, color: T.muted }}>퀴즈는 선택사항입니다.</div>}
              <input value={worker.name} onChange={(e) => setWorker((w) => ({ ...w, name: e.target.value }))} placeholder="성명" style={inp} />
              <input value={worker.contact} onChange={(e) => setWorker((w) => ({ ...w, contact: e.target.value }))} placeholder="연락처" style={inp} />
              {msg && <div style={{ fontSize: 12, color: T.red }}>{msg}</div>}
              <button onClick={complete} style={{ background: T.green, border: "none", borderRadius: 6, padding: "12px 0", fontWeight: 700, cursor: "pointer", color: "#0B0F14" }}>이수 완료</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ───────────────────── 사고 내역/통계 ───────────────────── */
const INCIDENT_CATEGORIES = ["임직원", "협력사", "고객"];
const INCIDENT_GRADES = [
  { key: "A", label: "A등급 (사망)", desc: "CEO 보고" },
  { key: "B", label: "B등급 (중상·장애가능)", desc: "ExCo/디렉터급 자동발신" },
  { key: "C", label: "C등급 (경미)", desc: "내부 관리" },
];
const gradeColor = (g) => (g === "A" ? T.red : g === "B" ? T.amber : T.cyan);

function Incidents({ user }) {
  const isMobile = useIsMobile();
  const canRegister = can(user, "registerIncident");
  const canManageAlerts = can(user, "manageIncidentAlerts");
  const [sub, setSub] = useState(canRegister ? "register" : "list");
  const [incidents, setIncidents] = useState([]);
  const [stats, setStats] = useState(null);
  const [filter, setFilter] = useState({ category: "", grade: "" });
  const [form, setForm] = useState({ category: INCIDENT_CATEGORIES[0], grade: "C", site: "", type: "", description: "", occurredAt: "", reporter: "" });
  const [toast, setToast] = useState(null);
  const [settings, setSettings] = useState([]);
  const [log, setLog] = useState([]);
  const [settingForm, setSettingForm] = useState({ grade: "A", department: "", recipientName: "", recipientContact: "", channel: "kakao" });

  const loadList = () => {
    const qs = new URLSearchParams();
    if (filter.category) qs.set("category", filter.category);
    if (filter.grade) qs.set("grade", filter.grade);
    fetch(`/api/incidents?${qs}`).then((r) => r.json()).then(setIncidents);
  };
  useEffect(() => { loadList(); }, [filter.category, filter.grade]);
  useEffect(() => { fetch("/api/incidents/stats").then((r) => r.json()).then(setStats); }, [incidents]);
  useEffect(() => {
    if (sub === "notify") {
      fetch("/api/notifications/settings").then((r) => r.json()).then(setSettings);
      fetch("/api/notifications/log").then((r) => r.json()).then(setLog);
    }
  }, [sub]);

  const inp = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: "10px 12px", fontSize: 13, outline: "none", width: "100%", boxSizing: "border-box" };

  const submit = () => {
    if (!form.type.trim() || !form.description.trim()) return;
    fetch("/api/incidents", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form) })
      .then((r) => r.json())
      .then((created) => {
        setForm({ category: INCIDENT_CATEGORIES[0], grade: "C", site: "", type: "", description: "", occurredAt: "", reporter: "" });
        loadList();
        setToast(
          created.notified && created.notified.length
            ? `${created.id} 등록 완료 · ${created.grade}등급 자동알림 ${created.notified.length}건 발송(모의)`
            : `${created.id} 등록 완료`
        );
        setTimeout(() => setToast(null), 4000);
        setSub("list");
      });
  };

  const addSetting = () => {
    if (!settingForm.department.trim() || !settingForm.recipientName.trim() || !settingForm.recipientContact.trim()) return;
    fetch("/api/notifications/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(settingForm) })
      .then((r) => r.json())
      .then(() => {
        setSettingForm((f) => ({ ...f, department: "", recipientName: "", recipientContact: "" }));
        fetch("/api/notifications/settings").then((r) => r.json()).then(setSettings);
      });
  };
  const removeSetting = (id) =>
    fetch(`/api/notifications/settings/${id}`, { method: "DELETE" }).then(() => setSettings((s) => s.filter((x) => x.id !== id)));

  const subTabs = [
    canRegister && { key: "register", label: "등록" },
    { key: "list", label: "목록" },
    { key: "stats", label: "통계" },
    canManageAlerts && { key: "notify", label: "등급별 알림설정" },
  ].filter(Boolean);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {subTabs.map((t) => (
          <button key={t.key} onClick={() => setSub(t.key)} style={{
            background: sub === t.key ? `${T.amber}22` : "none",
            border: `1px solid ${sub === t.key ? T.amber : T.line}`, color: sub === t.key ? T.amber : T.muted,
            borderRadius: 6, padding: "8px 14px", fontSize: 13, cursor: "pointer",
          }}>{t.label}</button>
        ))}
      </div>

      {sub === "register" && (
        <Panel title="사고 등록">
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 12 }}>
            <Field label="구분" required>
              <select value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} style={inp}>
                {INCIDENT_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="사고 등급" required>
              <select value={form.grade} onChange={(e) => setForm((f) => ({ ...f, grade: e.target.value }))} style={inp}>
                {INCIDENT_GRADES.map((g) => <option key={g.key} value={g.key}>{g.label}</option>)}
              </select>
            </Field>
            <Field label="발생 장소"><input value={form.site} onChange={(e) => setForm((f) => ({ ...f, site: e.target.value }))} style={inp} /></Field>
            <Field label="사고 유형"><input value={form.type} onChange={(e) => setForm((f) => ({ ...f, type: e.target.value }))} placeholder="예: 추락, 협착, 화상" style={inp} /></Field>
            <Field label="발생 일시"><input type="datetime-local" value={form.occurredAt} onChange={(e) => setForm((f) => ({ ...f, occurredAt: e.target.value }))} style={inp} /></Field>
            <Field label="보고자"><input value={form.reporter} onChange={(e) => setForm((f) => ({ ...f, reporter: e.target.value }))} style={inp} /></Field>
            <Field label="사고 내용" required span>
              <textarea rows={3} value={form.description} onChange={(e) => setForm((f) => ({ ...f, description: e.target.value }))} style={{ ...inp, resize: "vertical", fontFamily: "inherit" }} />
            </Field>
          </div>
          <div style={{ fontSize: 11, color: T.muted, marginTop: 10, lineHeight: 1.8 }}>
            {INCIDENT_GRADES.map((g) => (
              <div key={g.key}><Badge color={gradeColor(g.key)}>{g.key}</Badge> {g.label} → {g.desc}</div>
            ))}
          </div>
          <button onClick={submit} style={{ marginTop: 14, width: "100%", background: T.amber, border: "none", borderRadius: 6, padding: "13px 0", fontWeight: 700, cursor: "pointer" }}>등록</button>
        </Panel>
      )}

      {sub === "list" && (
        <Panel title="사고 내역" right={
          <div className="safeops-noprint" style={{ display: "flex", gap: 8 }}>
            <a href="/api/incidents/export.csv" style={{ background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 4, padding: "4px 10px", fontSize: 11, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 4 }}><Download size={12} /> Excel(CSV)</a>
            <button onClick={() => window.print()} style={{ background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 4, padding: "4px 10px", fontSize: 11, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4 }}><Printer size={12} /> PDF/인쇄</button>
          </div>
        }>
          <div className="safeops-noprint" style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
            <select value={filter.category} onChange={(e) => setFilter((f) => ({ ...f, category: e.target.value }))} style={{ ...inp, width: "auto" }}>
              <option value="">전체 구분</option>
              {INCIDENT_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
            <select value={filter.grade} onChange={(e) => setFilter((f) => ({ ...f, grade: e.target.value }))} style={{ ...inp, width: "auto" }}>
              <option value="">전체 등급</option>
              {INCIDENT_GRADES.map((g) => <option key={g.key} value={g.key}>{g.key}등급</option>)}
            </select>
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 700 }}>
              <thead>
                <tr style={{ color: T.muted, fontFamily: T.mono, fontSize: 11, textAlign: "left" }}>
                  {["ID", "구분", "등급", "장소", "유형", "발생일시", "상태"].map((h) => <th key={h} style={{ padding: "8px 10px", borderBottom: `1px solid ${T.line}`, fontWeight: 500 }}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {incidents.map((i) => (
                  <tr key={i.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                    <td style={{ padding: "10px", fontFamily: T.mono, color: T.cyan }}>{i.id}</td>
                    <td style={{ padding: "10px" }}>{i.category}</td>
                    <td style={{ padding: "10px" }}><Badge color={gradeColor(i.grade)}>{i.grade}등급</Badge></td>
                    <td style={{ padding: "10px", color: T.muted }}>{i.site}</td>
                    <td style={{ padding: "10px" }}>{i.type}</td>
                    <td style={{ padding: "10px", fontFamily: T.mono, fontSize: 12, color: T.muted }}>{i.occurred_at || "-"}</td>
                    <td style={{ padding: "10px" }}>{i.status}</td>
                  </tr>
                ))}
                {incidents.length === 0 && (
                  <tr><td colSpan={7} style={{ padding: 16, textAlign: "center", color: T.muted }}>등록된 사고 내역이 없습니다.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </Panel>
      )}

      {sub === "stats" && stats && (
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 14 }}>
          <Panel title="구분별 사고 건수">
            <div style={{ height: 220 }}>
              <ResponsiveContainer>
                <BarChart data={stats.byCategory.map((r) => ({ name: r.category, cnt: r.n }))}>
                  <CartesianGrid stroke={T.line} vertical={false} />
                  <XAxis dataKey="name" stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} />
                  <YAxis stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} width={24} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, fontSize: 12 }} />
                  <Bar dataKey="cnt" name="건수" radius={[3, 3, 0, 0]} fill={T.cyan} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Panel>
          <Panel title="등급별 사고 건수">
            <div style={{ height: 220 }}>
              <ResponsiveContainer>
                <BarChart data={stats.byGrade.map((r) => ({ name: `${r.grade}등급`, cnt: r.n, grade: r.grade }))}>
                  <CartesianGrid stroke={T.line} vertical={false} />
                  <XAxis dataKey="name" stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} />
                  <YAxis stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} width={24} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, fontSize: 12 }} />
                  <Bar dataKey="cnt" name="건수" radius={[3, 3, 0, 0]}>
                    {stats.byGrade.map((r, i) => <Cell key={i} fill={gradeColor(r.grade)} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Panel>
          <Panel title="월별 발생 추이" style={{ gridColumn: isMobile ? "auto" : "1 / -1" }}>
            <div style={{ height: 200 }}>
              <ResponsiveContainer>
                <BarChart data={stats.byMonth.map((r) => ({ name: r.month, cnt: r.n }))}>
                  <CartesianGrid stroke={T.line} vertical={false} />
                  <XAxis dataKey="name" stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} />
                  <YAxis stroke={T.muted} fontSize={12} tickLine={false} axisLine={false} width={24} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, fontSize: 12 }} />
                  <Bar dataKey="cnt" name="건수" radius={[3, 3, 0, 0]} fill={T.amber} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Panel>
        </div>
      )}

      {sub === "notify" && (
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 14, alignItems: "start" }}>
          <Panel title="등급별 수신자 설정">
            <div style={{ fontSize: 11, color: T.muted, marginBottom: 10, lineHeight: 1.6 }}>
              카카오톡(공용 듀티폰 계정) 또는 CCC 문자 연동은 CCC·IT 협의 후 실제 발송으로 전환됩니다. 현재는 등록된 수신자에게 모의 발송 기록만 남습니다.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
              {settings.map((s) => (
                <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", fontSize: 12, flexWrap: "wrap" }}>
                  <Badge color={gradeColor(s.grade)}>{s.grade}등급</Badge>
                  <span style={{ fontWeight: 600 }}>{s.department}</span>
                  <span style={{ color: T.muted }}>{s.recipient_name} · {s.recipient_contact}</span>
                  <span style={{ marginLeft: "auto", fontFamily: T.mono, fontSize: 11, color: T.muted }}>{s.channel === "kakao" ? "카카오톡" : "CCC 문자"}</span>
                  <button onClick={() => removeSetting(s.id)} style={{ background: "none", border: "none", color: T.red, cursor: "pointer" }}><Trash2 size={14} /></button>
                </div>
              ))}
              {settings.length === 0 && <div style={{ color: T.muted, fontSize: 13 }}>등록된 수신자가 없습니다.</div>}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "80px 1fr", gap: 8 }}>
              <select value={settingForm.grade} onChange={(e) => setSettingForm((f) => ({ ...f, grade: e.target.value }))} style={inp}>
                {["A", "B", "C"].map((g) => <option key={g} value={g}>{g}등급</option>)}
              </select>
              <input value={settingForm.department} onChange={(e) => setSettingForm((f) => ({ ...f, department: e.target.value }))} placeholder="부서(예: 홍보팀)" style={inp} />
              <input value={settingForm.recipientName} onChange={(e) => setSettingForm((f) => ({ ...f, recipientName: e.target.value }))} placeholder="수신자 성명" style={{ ...inp, gridColumn: "1 / -1" }} />
              <input value={settingForm.recipientContact} onChange={(e) => setSettingForm((f) => ({ ...f, recipientContact: e.target.value }))} placeholder="연락처" style={{ ...inp, gridColumn: "1 / -1" }} />
              <select value={settingForm.channel} onChange={(e) => setSettingForm((f) => ({ ...f, channel: e.target.value }))} style={{ ...inp, gridColumn: "1 / -1" }}>
                <option value="kakao">카카오톡(듀티폰)</option>
                <option value="ccc_sms">CCC 문자</option>
              </select>
              <button onClick={addSetting} style={{ gridColumn: "1 / -1", background: T.amber, border: "none", borderRadius: 6, padding: "10px 0", fontWeight: 700, cursor: "pointer" }}>수신자 추가</button>
            </div>
          </Panel>
          <Panel title="모의 발송 이력">
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {log.map((l) => (
                <div key={l.id} style={{ background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "8px 10px", fontSize: 12 }}>
                  <div><Badge color={gradeColor(l.grade)}>{l.grade}등급</Badge> <span style={{ fontFamily: T.mono, color: T.cyan, marginLeft: 6 }}>{l.incidentId}</span></div>
                  <div style={{ color: T.muted, marginTop: 4 }}>{l.recipients.map((r) => r.recipient_name).join(", ")} · {l.sentAt}</div>
                </div>
              ))}
              {log.length === 0 && <div style={{ color: T.muted, fontSize: 13 }}>발송 이력이 없습니다.</div>}
            </div>
          </Panel>
        </div>
      )}

      {toast && (
        <div style={{ background: T.panel, border: `1px solid ${T.green}66`, borderRadius: 8, padding: "12px 16px", fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
          <CircleCheck size={16} color={T.green} /> {toast}
        </div>
      )}
    </div>
  );
}

/* ───────────────────── 비상연락망 ───────────────────── */
function EmergencyContacts({ user }) {
  const isMobile = useIsMobile();
  const canEdit = can(user, "editContacts");
  const [contacts, setContacts] = useState([]);
  const [form, setForm] = useState({ name: "", role: "", phone: "", category: "사내" });
  const load = () => fetch("/api/emergency-contacts").then((r) => r.json()).then(setContacts);
  useEffect(() => { load(); }, []);

  const grouped = useMemo(() => {
    const m = {};
    contacts.forEach((c) => { (m[c.category] = m[c.category] || []).push(c); });
    return m;
  }, [contacts]);

  const inp = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: "10px 12px", fontSize: 13, outline: "none" };

  const submit = () => {
    if (!form.name.trim() || !form.phone.trim()) return;
    fetch("/api/emergency-contacts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form) })
      .then((r) => r.json())
      .then(() => { setForm({ name: "", role: "", phone: "", category: "사내" }); load(); });
  };
  const remove = (id) => fetch(`/api/emergency-contacts/${id}`, { method: "DELETE" }).then(load);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {canEdit && (
        <Panel title="연락처 추가">
          <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr 120px 90px", gap: 8 }}>
            <input value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="명칭(예: 소방서)" style={inp} />
            <input value={form.role} onChange={(e) => setForm((f) => ({ ...f, role: e.target.value }))} placeholder="역할" style={inp} />
            <input value={form.phone} onChange={(e) => setForm((f) => ({ ...f, phone: e.target.value }))} placeholder="연락처" style={inp} />
            <select value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} style={inp}>
              {["사내", "외부기관", "의료기관"].map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
            <button onClick={submit} style={{ background: T.amber, border: "none", borderRadius: 6, fontWeight: 700, cursor: "pointer" }}>추가</button>
          </div>
        </Panel>
      )}
      {Object.entries(grouped).map(([cat, list]) => (
        <Panel key={cat} title={cat}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {list.map((c) => (
              <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10, background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "10px 12px", flexWrap: "wrap" }}>
                <PhoneCall size={15} color={T.cyan} />
                <div style={{ flex: 1, minWidth: 100 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{c.name}</div>
                  {c.role && <div style={{ fontSize: 11, color: T.muted }}>{c.role}</div>}
                </div>
                <a href={`tel:${c.phone}`} style={{ fontFamily: T.mono, color: T.amber, fontSize: 13, textDecoration: "none" }}>{c.phone}</a>
                {canEdit && (
                  <button onClick={() => remove(c.id)} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer" }}><Trash2 size={14} /></button>
                )}
              </div>
            ))}
          </div>
        </Panel>
      ))}
      {contacts.length === 0 && <div style={{ color: T.muted, fontSize: 13 }}>등록된 비상연락처가 없습니다.</div>}
    </div>
  );
}

/* ───────────────────── 마이페이지 ─────────────────────
   실제 서버 계정(user prop, /api/auth/me)을 기반으로 한다. 본인이 등록(발급)한
   작업허가서 중 아직 서명을 완료하지 못한 작업자를 바로 확인할 수 있게 한다. */
function MyPage({ user, theme, onToggleTheme }) {
  const [draft, setDraft] = useState({ name: user.name, department: user.department || "", contact: user.contact || "" });
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [myPermits, setMyPermits] = useState([]);

  const inp = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: "10px 12px", fontSize: 13, outline: "none", width: "100%", boxSizing: "border-box" };

  const loadMyPermits = () => fetch("/api/permits?mine=1").then((r) => r.json()).then(setMyPermits).catch(() => {});
  useEffect(() => { loadMyPermits(); }, []);

  // 내가 등록한 허가서 중 아직 서명을 완료하지 못한 작업자 목록
  const unsigned = useMemo(() => {
    const rows = [];
    for (const p of myPermits) {
      for (const w of permitWorkers(p)) {
        if (!w.signed) rows.push({ permitId: p.id, permitType: p.type, site: p.site, name: w.name, contact: w.contact });
      }
    }
    return rows;
  }, [myPermits]);

  const save = () => {
    if (!draft.name.trim()) return;
    setSaving(true);
    setError("");
    fetch("/api/auth/me", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(draft),
    })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || "저장에 실패했습니다.");
        setEditing(false);
      })
      .catch((err) => setError(err.message))
      .finally(() => setSaving(false));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, maxWidth: 760 }}>
      <Panel title="내 프로필" right={!editing && (
        <button onClick={() => { setDraft({ name: user.name, department: user.department || "", contact: user.contact || "" }); setEditing(true); }} style={{
          background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 4,
          padding: "4px 10px", fontSize: 12, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4,
        }}><Pencil size={12} /> 수정</button>
      )}>
        {editing ? (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="성명" required><input value={draft.name} onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))} style={inp} /></Field>
            <Field label="연락처"><input value={draft.contact} onChange={(e) => setDraft((d) => ({ ...d, contact: e.target.value }))} placeholder="010-0000-0000" style={inp} /></Field>
            <Field label="부서" span><input value={draft.department} onChange={(e) => setDraft((d) => ({ ...d, department: e.target.value }))} style={inp} /></Field>
            {error && <div style={{ gridColumn: "1 / -1", fontSize: 12, color: T.red }}>{error}</div>}
            <div style={{ gridColumn: "1 / -1", display: "flex", gap: 8 }}>
              <button onClick={save} disabled={saving} style={{ flex: 1, background: T.amber, border: "none", borderRadius: 6, padding: "11px 0", fontWeight: 700, cursor: saving ? "default" : "pointer", opacity: saving ? 0.6 : 1 }}>저장</button>
              <button onClick={() => setEditing(false)} style={{ background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 6, padding: "11px 16px", cursor: "pointer" }}>취소</button>
            </div>
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{
              width: 48, height: 48, borderRadius: "50%", background: `${T.amber}18`, border: `1px solid ${T.amber}55`,
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
            }}><User size={22} color={T.amber} /></div>
            <div>
              <div style={{ fontSize: 16, fontWeight: 700, color: T.text, display: "flex", alignItems: "center", gap: 8 }}>
                {user.name} <Badge color={T.cyan}>{user.role}</Badge>
              </div>
              <div style={{ fontSize: 12, color: T.muted, marginTop: 2 }}>
                {[user.department, user.username].filter(Boolean).join(" · ")} {user.contact ? `· ${user.contact}` : ""}
              </div>
            </div>
          </div>
        )}
      </Panel>

      {!editing && (
        <>
          <Panel title="화면 설정">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>다크/라이트 모드</div>
                <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>현재: {theme === "dark" ? "다크 모드" : "라이트 모드"}</div>
              </div>
              <button onClick={onToggleTheme} style={{
                background: T.bg, border: `1px solid ${T.line}`, color: T.text, borderRadius: 6,
                padding: "8px 14px", fontSize: 13, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6,
              }}>{theme === "dark" ? <><Sun size={14} /> 라이트로 전환</> : <><Moon size={14} /> 다크로 전환</>}</button>
            </div>
          </Panel>

          <Panel title="내가 올린 작업자 중 서명 미완료" right={<Badge color={unsigned.length ? T.amber : T.green}>{unsigned.length}명</Badge>}>

              <div style={{ color: T.muted, fontSize: 13 }}>내가 등록한 허가서의 작업자가 모두 서명을 완료했습니다.</div>
            ) : (

                {unsigned.map((w, i) => (

/* ───────────────────── 계정 관리 (시스템 어드민 전용) ───────────────────── */
function AccountsAdmin({ currentUser }) {
  const isMobile = useIsMobile();
  const [users, setUsers] = useState([]);
  const [form, setForm] = useState({ username: "", password: "", name: "", department: "", contact: "", role: ROLES[ROLES.length - 1] });
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState("");

  const load = () => fetch("/api/users").then((r) => r.json()).then(setUsers).catch(() => {});
  useEffect(() => { load(); }, []);

  const inp = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text, padding: "10px 12px", fontSize: 13, outline: "none", width: "100%", boxSizing: "border-box" };

  const resetForm = () => { setForm({ username: "", password: "", name: "", department: "", contact: "", role: ROLES[ROLES.length - 1] }); setEditingId(null); setError(""); };

  const submit = () => {
    setError("");
    const isEdit = editingId != null;
    const body = { username: form.username, name: form.name, department: form.department, contact: form.contact, role: form.role };
    if (!isEdit) { body.password = form.password; }
    else if (form.password) { body.password = form.password; }
    if (!form.username.trim() || !form.name.trim() || (!isEdit && !form.password)) {
      setError("아이디, 비밀번호, 성명은 필수입니다."); return;
    }
    fetch(isEdit ? `/api/users/${editingId}` : "/api/users", {
      method: isEdit ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || "저장에 실패했습니다.");
        resetForm();
        load();
      })
      .catch((err) => setError(err.message));
  };

  const startEdit = (u) => {
    setEditingId(u.id);
    setForm({ username: u.username, password: "", name: u.name, department: u.department || "", contact: u.contact || "", role: u.role });
    setError("");
  };

  const remove = (u) => {
    if (u.id === currentUser.id) return;
    fetch(`/api/users/${u.id}`, { method: "DELETE" }).then(() => load());
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Panel title={editingId != null ? "계정 수정" : "계정 등록"}>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 10 }}>
          <Field label="아이디" required>
            <input value={form.username} onChange={(e) => setForm((f) => ({ ...f, username: e.target.value }))} style={inp} />
          </Field>
          <Field label={editingId != null ? "비밀번호 (변경 시에만 입력)" : "비밀번호"} required={editingId == null}>
            <input type="password" value={form.password} onChange={(e) => setForm((f) => ({ ...f, password: e.target.value }))} style={inp} placeholder={editingId != null ? "변경하지 않으려면 비워두세요" : "8자 이상"} />
          </Field>
          <Field label="성명" required><input value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} style={inp} /></Field>
          <Field label="부서"><input value={form.department} onChange={(e) => setForm((f) => ({ ...f, department: e.target.value }))} style={inp} /></Field>
          <Field label="연락처"><input value={form.contact} onChange={(e) => setForm((f) => ({ ...f, contact: e.target.value }))} style={inp} /></Field>
          <Field label="계정 유형" required>
            <select value={form.role} onChange={(e) => setForm((f) => ({ ...f, role: e.target.value }))} style={inp}>
              {ROLES.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
          </Field>
        </div>
        {error && <div style={{ fontSize: 12, color: T.red, marginTop: 10 }}>{error}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <button onClick={submit} style={{ flex: 1, background: T.amber, border: "none", borderRadius: 6, padding: "11px 0", fontWeight: 700, cursor: "pointer" }}>
            {editingId != null ? "저장" : "계정 등록"}
          </button>
          {editingId != null && (
            <button onClick={resetForm} style={{ background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 6, padding: "11px 16px", cursor: "pointer" }}>취소</button>
          )}
        </div>
      </Panel>

      <Panel title="계정 목록" right={<Badge color={T.cyan}>{users.length}명</Badge>}>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 640 }}>
            <thead>
              <tr style={{ color: T.muted, fontFamily: T.mono, fontSize: 11, textAlign: "left" }}>
                {["아이디", "성명", "부서", "계정 유형", ""].map((h) => (
                  <th key={h} style={{ padding: "8px 10px", borderBottom: `1px solid ${T.line}`, fontWeight: 500 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map((u) => (
                <tr key={u.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                  <td style={{ padding: "10px", fontFamily: T.mono }}>{u.username}</td>
                  <td style={{ padding: "10px" }}>{u.name} {u.id === currentUser.id && <span style={{ color: T.muted, fontSize: 11 }}>(나)</span>}</td>
                  <td style={{ padding: "10px", color: T.muted }}>{u.department || "-"}</td>
                  <td style={{ padding: "10px" }}><Badge color={T.cyan}>{u.role}</Badge></td>
                  <td style={{ padding: "10px", whiteSpace: "nowrap" }}>
                    <button onClick={() => startEdit(u)} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 4 }}><Pencil size={14} /></button>
                    {u.id !== currentUser.id && (
                      <button onClick={() => remove(u)} style={{ background: "none", border: "none", color: T.red, cursor: "pointer", padding: 4 }}><Trash2 size={14} /></button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>
    </div>
  );
}

/* ───────────────────── 권한 매트릭스 ─────────────────────
   서버(server/lib/auth.js, 각 routes/*.js)가 실제 접근제어를 강제한다.
   프론트의 can()은 UX상 불필요한 버튼을 숨기기 위한 보조 수단일 뿐,
   보안 경계가 아니다. */
const ROLES = ["시스템 어드민", "슈퍼 EHS", "EHS", "Security", "기타 임직원"];
const PERMISSIONS = {
  manageAccounts: ["시스템 어드민"],
  editContent: ["시스템 어드민", "슈퍼 EHS", "EHS"], // 위험성평가·교육자료·규정지침 등록/수정
  approvePermit: ["시스템 어드민", "슈퍼 EHS", "EHS"],
  issuePermit: ["시스템 어드민", "슈퍼 EHS", "EHS", "Security"], // 작성/서명링크 발송
  registerIncident: ["시스템 어드민", "슈퍼 EHS", "EHS", "Security"],
  manageIncidentAlerts: ["시스템 어드민", "슈퍼 EHS", "EHS"],
  editContacts: ["시스템 어드민", "슈퍼 EHS", "EHS", "Security"],
};
function can(user, action) {
  return !!user && (PERMISSIONS[action] || []).includes(user.role);
}

  );
}

/* ───────────────────── 메인 앱 ───────────────────── */
const NAV = [
  { key: "overview", label: "종합현황", icon: LayoutDashboard },
  { key: "zone", label: "작업구역", icon: Building2 },
  { key: "permits", label: "허가서", icon: FileCheck2 },
  { key: "form", label: "작성", icon: FilePlus2, require: "issuePermit" },
  { key: "sign", label: "서명링크", icon: PenLine, require: "issuePermit" },
  { key: "riskassess", label: "위험성평가", icon: ClipboardList },
  { key: "training", label: "교육", icon: GraduationCap },
  { key: "docs", label: "규정지침", icon: BookOpen },
  { key: "incidents", label: "사고내역", icon: TriangleAlert },
  { key: "contacts", label: "비상연락망", icon: PhoneCall },
  { key: "alarms", label: "알람", icon: BellRing },
  { key: "accounts", label: "계정관리", icon: UserCog, require: "manageAccounts" },
];
const NAV_FULL_LABEL = {
  overview: "종합현황", zone: "작업구역", permits: "작업허가서", form: "허가서 작성", sign: "서명링크",
  riskassess: "위험성평가", training: "작업자 교육", docs: "규정·지침·절차서", incidents: "사고 내역/통계",
  contacts: "비상연락망", alarms: "알람이력", mypage: "마이페이지", accounts: "계정 관리",
};

function SafetyDashboard({ user, onLogout }) {
  const isMobile = useIsMobile();
  const visibleNav = NAV.filter((n) => !n.require || can(user, n.require));
  const [tab, setTab] = useState("overview");
  const [agentOpen, setAgentOpen] = useState(false);
  const [permits, setPermits] = useState([]);
  const [alarms, setAlarms] = useState([]);
  const [sentLinks, setSentLinks] = useState([]);
  const [preselect, setPreselect] = useState(null);
  const [toast, setToast] = useState(null);
  const [theme, setTheme] = useState(() => (typeof localStorage !== "undefined" && localStorage.getItem("safeops-theme")) || "dark");
  const { data: temp, live: tempLive } = useTempFeed();

  // 렌더링 전 T 토큰을 현재 테마 색상으로 in-place 갱신 — 모든 하위 컴포넌트가
  // 이번 렌더에서 새 색상을 읽는다 (React.memo 미사용이므로 부모 리렌더 시 전체 재실행됨).
  applyTheme(theme);
  useEffect(() => {
    try { localStorage.setItem("safeops-theme", theme); } catch (e) {}
  }, [theme]);
  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  // 데스크톱에서는 에이전트 기본 열림
  useEffect(() => { if (!isMobile) setAgentOpen(true); }, [isMobile]);

  // 초기 로드: 허가서·알람·서명링크 이력을 서버(SQLite)에서 조회
  useEffect(() => {
    fetch("/api/permits").then((r) => r.json()).then(setPermits).catch(() => {});
    fetch("/api/alarms").then((r) => r.json()).then(setAlarms).catch(() => {});
    fetch("/api/sign-links").then((r) => r.json()).then(setSentLinks).catch(() => {});
  }, []);

  // 알람 확인(ack) 실시간 반영 — 다른 클라이언트의 확인 처리도 즉시 동기화
  // (STANDALONE 모드에서는 서버가 없어 SSE 연결이 불가능하므로 건너뛴다)
  useEffect(() => {
    if (STANDALONE) return;
    const es = new EventSource("/api/alarms/stream");
    es.onmessage = (e) => {
      const updated = JSON.parse(e.data);
      setAlarms((prev) => prev.map((a) => (a.id === updated.id ? updated : a)));
    };
    return () => es.close();
  }, []);

  const ackAlarm = (id) => {
    fetch(`/api/alarms/${id}/ack`, { method: "POST" })
      .then((r) => r.json())
      .then((updated) => setAlarms((prev) => prev.map((a) => (a.id === updated.id ? updated : a))))
      .catch(() => {});
  };

  const approvePermit = (id) => {
    fetch(`/api/permits/${id}/approve`, { method: "POST" })
      .then((r) => r.json())
      .then((updated) => setPermits((prev) => prev.map((p) => (p.id === updated.id ? updated : p))))
      .catch(() => {});
  };
  const rejectPermit = (id) => {
    fetch(`/api/permits/${id}/reject`, { method: "POST" })
      .then((r) => r.json())
      .then((updated) => setPermits((prev) => prev.map((p) => (p.id === updated.id ? updated : p))))
      .catch(() => {});
  };

  const sendLink = (permit, targets) => {
    const list = targets && targets.length
      ? targets
      : permitWorkers(permit).filter((w) => !w.signed);
    if (list.length === 0) return;
    Promise.all(
      list.map((w) =>
        fetch("/api/sign-links", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ permitId: permit.id, worker: w.name, contact: w.contact }),
        }).then((r) => r.json())
      )
    ).then((sent) => {
      setSentLinks((prev) => [...sent.reverse(), ...prev]);
      setToast(
        list.length === 1
          ? `${list[0].name} (${list[0].contact})에게 서명링크를 전송했습니다.`
          : `미서명 작업자 ${list.length}명에게 서명링크를 전송했습니다.`
      );
      setTimeout(() => setToast(null), 3000);
    });
  };

  const goSign = (permit) => { setPreselect(permit.id); setTab("sign"); };

  const addPermit = (p) => {
    fetch("/api/permits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(p),
    })
      .then((r) => r.json())
      .then((created) => {
        setPermits((prev) => [created, ...prev]);
        setToast(`${created.id} 허가서가 승인대기로 등록되었습니다. (작업자 ${p.workers.length}명, 서명 ${p.workers.filter((w) => w.signed).length}명)`);
        setTimeout(() => setToast(null), 3500);
        setTab("permits");
      });
  };

  const content = (
    <>
      {tab === "overview" && <Overview permits={permits} alarms={alarms} temp={temp} />}
      {tab === "zone" && <ZoneHub temp={temp} live={tempLive} />}
      {tab === "permits" && <Permits permits={permits} onSign={goSign} user={user} onApprove={approvePermit} onReject={rejectPermit} />}
      {tab === "form" && can(user, "issuePermit") && <PermitForm onSubmit={addPermit} />}
      {tab === "sign" && can(user, "issuePermit") && <SignLink permits={permits} sentLinks={sentLinks} onSend={sendLink} preselect={preselect} />}
      {tab === "riskassess" && <RiskAssessments />}
      {tab === "training" && <Training user={user} />}
      {tab === "docs" && <Documents user={user} />}
      {tab === "incidents" && <Incidents user={user} />}
      {tab === "contacts" && <EmergencyContacts user={user} />}
      {tab === "alarms" && <AlarmHistory alarms={alarms} onAck={ackAlarm} />}
      {tab === "mypage" && <MyPage user={user} theme={theme} onToggleTheme={toggleTheme} />}
      {tab === "accounts" && can(user, "manageAccounts") && <AccountsAdmin currentUser={user} />}
    </>
  );

  const fontFamily = "'Pretendard', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif";

  /* ── 모바일 레이아웃 ── */
  if (isMobile) {
    return (
      <div style={{
        display: "flex", flexDirection: "column", height: "100vh",
        background: T.bg, color: T.text, fontFamily, overflow: "hidden",
      }}>
        {/* 상단 헤더 */}
        <div style={{ background: T.panel2, borderBottom: `1px solid ${T.line}` }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px" }}>
            <div style={{ display: "flex", alignItems: "center" }}>
              <img src="assets/logo-icon.png" alt="" style={{ width: 24, height: 24, objectFit: "contain", marginRight: 8 }} />
              <span style={{ fontSize: 12, color: T.muted }}>{NAV_FULL_LABEL[tab]}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: T.green, boxShadow: `0 0 6px ${T.green}` }} />
              <button onClick={() => setTab("mypage")} title="마이페이지" style={{
                background: tab === "mypage" ? `${T.amber}18` : "none", border: `1px solid ${tab === "mypage" ? T.amber : T.line}`,
                color: tab === "mypage" ? T.amber : T.muted, borderRadius: 6, width: 34, height: 34,
                display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
              }}><User size={16} /></button>
              <ThemeToggle theme={theme} onToggle={toggleTheme} />
              <button onClick={() => setAgentOpen(true)} style={{
                background: `${T.amber}18`, border: `1px solid ${T.amber}55`, color: T.amber,
                borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer",
                display: "flex", alignItems: "center", gap: 6,
              }}>
                <Bot size={14} /> 에이전트
              </button>
              <button onClick={onLogout} title="로그아웃" style={{
                background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 6, width: 34, height: 34,
                display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
              }}><LogOut size={15} /></button>
            </div>
          </div>
          <div style={{ height: 4, background: `repeating-linear-gradient(-45deg, ${T.amber} 0 8px, #0F0D18 8px 16px)` }} />
        </div>

        {/* 콘텐츠 */}
        <div style={{ flex: 1, overflowY: "auto", padding: 14, WebkitOverflowScrolling: "touch" }}>
          {content}
        </div>

        {/* 하단 탭바 */}
        <div style={{
          display: "flex", overflowX: "auto", background: T.panel2,
          borderTop: `1px solid ${T.line}`, WebkitOverflowScrolling: "touch",
          paddingBottom: "env(safe-area-inset-bottom)",
        }}>
          {visibleNav.map(({ key, label, icon: Icon }) => (
            <button key={key} onClick={() => setTab(key)} style={{
              flex: "1 0 auto", minWidth: 66, padding: "10px 6px 8px",
              background: "none", border: "none",
              borderTop: `2px solid ${tab === key ? T.amber : "transparent"}`,
              color: tab === key ? T.amber : T.muted, cursor: "pointer",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
            }}>
              <Icon size={19} />
              <span style={{ fontSize: 10 }}>{label}</span>
            </button>
          ))}
        </div>

        <AgentPanel open={agentOpen} onClose={() => setAgentOpen(false)} permits={permits} alarms={alarms} sentLinks={sentLinks} />

        {toast && (
          <div style={{
            position: "fixed", bottom: 88, left: 16, right: 16,
            background: T.panel, border: `1px solid ${T.green}66`, color: T.text,
            padding: "12px 16px", borderRadius: 8, fontSize: 13, zIndex: 120,
            display: "flex", alignItems: "center", gap: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
          }}>
            <CircleCheck size={16} color={T.green} style={{ flexShrink: 0 }} /> {toast}
          </div>
        )}
      </div>
    );
  }

  /* ── 데스크톱 레이아웃 ── */
  return (
    <div style={{
      display: "flex", height: "100vh", background: T.bg, color: T.text,
      fontFamily, overflow: "hidden",
    }}>
      {/* 사이드바 */}
      <div style={{
        width: 200, flexShrink: 0, borderRight: `1px solid ${T.line}`, background: T.panel2,
        display: "flex", flexDirection: "column",
      }}>
        <div style={{ padding: "18px 16px 14px", display: "flex", alignItems: "center", gap: 10 }}>
          <img src="assets/logo-icon.png" alt="" style={{ width: 34, height: 34, objectFit: "contain", flexShrink: 0 }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontFamily: T.mono, fontSize: 13, fontWeight: 700, letterSpacing: "0.02em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              INSPIRE <span style={{ color: T.amber }}>BEACON</span>
            </div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>현장 안전관제 시스템</div>
          </div>
        </div>
        <div style={{ height: 5, background: `repeating-linear-gradient(-45deg, ${T.amber} 0 8px, #0F0D18 8px 16px)` }} />
        <nav style={{ padding: 10, display: "flex", flexDirection: "column", gap: 2, flex: 1, overflowY: "auto" }}>
          {visibleNav.map(({ key, icon: Icon }) => (
            <button key={key} onClick={() => setTab(key)} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "10px 12px",
              background: tab === key ? `${T.amber}18` : "none",
              border: "none", borderLeft: `2px solid ${tab === key ? T.amber : "transparent"}`,
              borderRadius: 4, color: tab === key ? T.text : T.muted,
              fontSize: 13, cursor: "pointer", textAlign: "left",
            }}>
              <Icon size={16} color={tab === key ? T.amber : T.muted} />
              {NAV_FULL_LABEL[key]}
            </button>
          ))}
        </nav>
        <button onClick={() => setAgentOpen((v) => !v)} style={{
          margin: "12px 12px 8px", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          padding: "10px 0", background: agentOpen ? `${T.amber}18` : "none",
          border: `1px solid ${T.amber}55`, borderRadius: 6, color: T.amber, fontSize: 13, cursor: "pointer",
        }}>
          <Bot size={15} /> {agentOpen ? "에이전트 닫기" : "에이전트 열기"}
        </button>
        <div style={{ margin: "0 12px 12px", padding: "10px 12px", borderTop: `1px solid ${T.line}`, paddingTop: 12, display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: T.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.name}</div>
            <div style={{ fontSize: 10, color: T.muted, marginTop: 1 }}>{user.role}</div>
          </div>
          <button onClick={onLogout} title="로그아웃" style={{
            background: "none", border: `1px solid ${T.line}`, color: T.muted, borderRadius: 6, width: 30, height: 30,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
          }}><LogOut size={14} /></button>
        </div>
      </div>

      {/* 메인 */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <div style={{
          padding: "14px 22px", borderBottom: `1px solid ${T.line}`,
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{NAV_FULL_LABEL[tab]}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ fontSize: 12, color: T.muted, fontFamily: T.mono, display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: T.green, boxShadow: `0 0 6px ${T.green}` }} />
              시스템 정상
            </div>
            <button onClick={() => setTab("mypage")} title="마이페이지" style={{
              background: tab === "mypage" ? `${T.amber}18` : "none", border: `1px solid ${tab === "mypage" ? T.amber : T.line}`,
              color: tab === "mypage" ? T.amber : T.muted, borderRadius: 6, width: 34, height: 34,
              display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
            }}><User size={16} /></button>
            <ThemeToggle theme={theme} onToggle={toggleTheme} />
          </div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 20 }}>
          {content}
        </div>
      </div>

      <AgentPanel open={agentOpen} onClose={() => setAgentOpen(false)} permits={permits} alarms={alarms} sentLinks={sentLinks} />

      {toast && (
        <div style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          background: T.panel, border: `1px solid ${T.green}66`, color: T.text,
          padding: "12px 20px", borderRadius: 8, fontSize: 13, zIndex: 50,
          display: "flex", alignItems: "center", gap: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
        }}>
          <CircleCheck size={16} color={T.green} /> {toast}
        </div>
      )}
    </div>
  );
}

/* ───────────────────── 인증 게이트 ───────────────────── */
function AuthLoading() {
  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: T.bg, color: T.muted, fontFamily: "'Pretendard', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif",
    }}>불러오는 중…</div>
  );
}

function App() {
  const [user, setUser] = useState(undefined); // undefined: 확인 중, null: 미로그인

  const refreshUser = () => fetch("/api/auth/me").then((r) => r.json()).then((d) => setUser(d.user || null)).catch(() => setUser(null));
  useEffect(() => { refreshUser(); }, []);

  const logout = () => {
    fetch("/api/auth/logout", { method: "POST" }).finally(() => setUser(null));
  };

  if (user === undefined) return <AuthLoading />;
  if (!user) return <LoginScreen onLogin={setUser} />;
  return <SafetyDashboard user={user} onLogout={logout} />;
}

const _root = createRoot(document.getElementById("root"));
_root.render(<App />);
const _l = document.getElementById("loading");
if (_l) _l.remove();
</script>
</body>
</html>
